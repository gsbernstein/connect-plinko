<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Plinko Four</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0A14;
    --panel:#171426;
    --panel-2:#1F1B33;
    --peg:#8B7FFF;
    --p1:#FF4D6D;
    --p1-dark:#8f2a3c;
    --p2:#FFD23F;
    --p2-dark:#8f7420;
    --ink:#F1EEFB;
    --ink-dim:#726C8C;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(circle at 50% 0%, #1c1832 0%, var(--bg) 55%);
    color:var(--ink);
    font-family:'IBM Plex Mono', monospace;
    display:flex;
    justify-content:center;
    padding:28px 14px 48px;
  }
  .wrap{
    width:100%;
    max-width:660px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(28px,6vw,40px);
    letter-spacing:-0.02em;
    margin:0;
    text-align:center;
    background:linear-gradient(90deg,var(--p1),var(--peg) 55%,var(--p2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .tagline{
    margin:-10px 0 4px;
    color:var(--ink-dim);
    font-size:13px;
    letter-spacing:0.04em;
    text-align:center;
  }
  .hud{
    width:100%;
    display:flex;
    flex-wrap:nowrap;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .score{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--panel);
    border:1px solid #2a2545;
    border-radius:10px;
    padding:8px 14px;
    font-size:13px;
    flex:none;
    white-space:nowrap;
  }
  .score .dot{width:11px;height:11px;border-radius:50%;flex:none;}
  .score.active{box-shadow:0 0 0 1px currentColor, 0 0 16px -2px currentColor;}
  .score.p1{color:var(--p1);}
  .score.p2{color:var(--p2);}
  .score b{color:var(--ink);font-family:'Space Grotesk',sans-serif;font-size:15px;}
  .mode-row{
    display:flex;
    justify-content:center;
    width:100%;
    margin-top:-6px;
  }
  .toggle{
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    color:var(--ink-dim);
    font-size:13px;
    user-select:none;
  }
  .toggle input{
    appearance:none;
    -webkit-appearance:none;
    width:34px;
    height:19px;
    background:#2a2545;
    border-radius:999px;
    position:relative;
    cursor:pointer;
    outline:none;
    transition:background .15s ease;
    flex:none;
  }
  .toggle input::after{
    content:'';
    position:absolute;
    top:2px; left:2px;
    width:15px; height:15px;
    background:var(--ink-dim);
    border-radius:50%;
    transition:transform .15s ease, background .15s ease;
  }
  .toggle input:checked{background:#463d7a;}
  .toggle input:checked::after{
    transform:translateX(15px);
    background:var(--peg);
  }
  .toggle span{font-weight:600;}
  .cols{
    display:grid;
    width:100%;
    gap:6px;
  }
  .colbtn{
    background:var(--panel-2);
    border:1px solid #2a2545;
    color:var(--ink-dim);
    border-radius:8px 8px 4px 4px;
    padding:9px 0;
    cursor:pointer;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:15px;
    transition:transform .08s ease, background .15s ease, color .15s ease, box-shadow .15s ease;
  }
  .colbtn:hover:not(:disabled){
    background:#2a2450;
    color:var(--ink);
    transform:translateY(-2px);
  }
  .colbtn:disabled{opacity:0.25;cursor:not-allowed;}
  .colbtn.full:not(:disabled){opacity:0.45;}
  .colbtn.full:not(:disabled)::after{content:' ↝';}
  .board-frame{
    position:relative;
    width:100%;
    background:var(--panel);
    border:1px solid #2a2545;
    border-radius:16px;
    padding:10px;
    box-shadow:0 20px 50px -20px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.02);
  }
  canvas{
    display:block;
    width:100%;
    height:auto;
    border-radius:10px;
  }
  .banner{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:14px;
    background:rgba(11,10,20,0.82);
    backdrop-filter:blur(2px);
    border-radius:16px;
    text-align:center;
  }
  .banner.show{display:flex;}
  .banner h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(22px,5vw,30px);
    margin:0;
  }
  .banner button{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:14px;
    background:var(--peg);
    color:#100c22;
    border:none;
    padding:10px 22px;
    border-radius:999px;
    cursor:pointer;
  }
  .footer-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    width:100%;
    margin-top:-4px;
  }
  .hint{color:var(--ink-dim);font-size:12px;}
  .reset{
    background:transparent;
    color:var(--ink-dim);
    border:1px solid #2a2545;
    border-radius:8px;
    padding:6px 12px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    cursor:pointer;
  }
  .reset:hover{color:var(--ink);border-color:#463d7a;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Plinko Four</h1>
  <div class="tagline">Press and drag on the board to aim, release to drop — full columns raise an arched bumper. Matches explode, and if the board packs solid you click one piece to blow it up.</div>

  <div class="hud">
    <div class="score p1" id="score1"><span class="dot" style="background:var(--p1)"></span>Red&nbsp;<b id="s1">0</b></div>
    <div class="score p2" id="score2"><span class="dot" style="background:var(--p2)"></span><span id="p2Label">Yellow</span>&nbsp;<b id="s2">0</b></div>
  </div>

  <div class="mode-row">
    <label class="toggle">
      <input type="checkbox" id="vsComputerToggle">
      <span>🤖 Play vs Computer</span>
    </label>
  </div>

  <div class="cols" id="cols"></div>

  <div class="board-frame">
    <canvas id="board" width="630" height="860"></canvas>
    <div class="banner" id="banner">
      <h2 id="bannerText">Red wins!</h2>
      <button id="playAgain">Play again</button>
    </div>
  </div>

  <div class="footer-row">
    <span class="hint">4+ in a row scores &amp; explodes — board full? click a piece to blow it up</span>
    <button class="reset" id="resetScores">Reset scores</button>
  </div>
</div>

<script>
(function(){
  const COLS = 7, ROWS = 6, CELL = 90;
  const PEG_ZONE = 380;
  const W = COLS*CELL, H = PEG_ZONE + ROWS*CELL;
  const canvas = document.getElementById('board');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const P1 = getCSS('--p1'), P1D = getCSS('--p1-dark');
  const P2 = getCSS('--p2'), P2D = getCSS('--p2-dark');
  const PEG = getCSS('--peg');
  const PANEL = getCSS('--panel');
  const PANEL2 = getCSS('--panel-2');
  const BG = getCSS('--bg');

  // Canvas is one flat raster with no real layers — punching holes directly
  // into the main canvas just erases straight down to nothing, since the
  // opaque plate fill already overwrote whatever pucks were drawn beneath
  // it. Building the plate on its own offscreen surface first, then
  // stamping THAT (with transparent holes) onto the main canvas, is what
  // actually lets the pucks underneath show through.
  const plateCanvas = document.createElement('canvas');
  plateCanvas.width = W; plateCanvas.height = H;
  const plateCtx = plateCanvas.getContext('2d');

  function getCSS(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

  // ---- board state ----
  let grid, colHeights, current, gameOver;
  let detonateMode = false;        // board full: click a piece to blow it up
  let detonateHover = null;        // {col,row} under the cursor while choosing
  let detonateConsumesTurn = false; // after a detonation settles, pass the turn
  let scores = {1:0, 2:0};
  let vsComputerEnabled = false;

  // Per-column stack of occupants, bottom-to-top: {type:'piece', player} for
  // a landed puck, or {type:'ball', ball, row} for one still in flight that
  // has already reserved its slot. Keeping both in one structure lets a
  // clear/gravity pass shift an in-flight ball's target row along with
  // everything else, instead of leaving it aimed at a slot that no longer
  // matches reality.
  let stack;

  function freshState(){
    grid = Array.from({length:COLS}, ()=>Array(ROWS).fill(0)); // grid[col][row], row 0 = top
    colHeights = Array(COLS).fill(0);
    stack = Array.from({length:COLS}, ()=>[]);
    current = 1;
    gameOver = false;
    detonateMode = false;
    detonateHover = null;
    detonateConsumesTurn = false;
    balls = [];
    resolving = false;
    resolvePhase = null;
    currentGroups = [];
    chainStep = 0;
    flashCells = null;
    particles = [];
    popups = [];
    recomputeBumpers();
  }

  // ---- pegs ----
  // A fixed lattice of peg positions. These never move — the only thing
  // that changes as columns fill is the addition of physical bumpers
  // (below), which the ball actually collides and bounces off of.
  const pegs = [];
  (function buildPegs(){
    const rows = 5;
    const topPad = 54, rowGap = 60;
    for(let r=0;r<rows;r++){
      const y = topPad + r*rowGap;
      const isEven = r % 2 === 0;
      const offset = isEven ? 0 : CELL/2;
      const cMin = 0, cMax = isEven ? COLS-1 : COLS-2; // inclusive
      for(let c=cMin;c<=cMax;c++){
        const x = offset + c*CELL + CELL/2;
        // jitter each peg so the lattice isn't perfectly symmetric —
        // this is what kills the repeating zigzag pattern
        const jx = (Math.random()*8-4);
        const jy = (Math.random()*5-2.5);
        pegs.push({x: x+jx, y: y+jy, r: 6});
      }
    }
  })();

  // ---- bumpers ----
  // Physical obstacles over runs of already-full columns. Contiguous full
  // columns share one gently arched bumper path so adjacent blockers read
  // as a single continuous hill. If a run touches a board edge it becomes
  // a half-arc peaking at that wall — so the slope kicks pucks inward
  // instead of trapping them against the edge. Collision uses overlapping
  // circles sampled along the path (same reflection model as pegs).
  let bumpers = [];
  let bumperPaths = []; // polylines for drawing the continuous arc
  const BUMPER_BASE_Y = PEG_ZONE - 18;
  const BUMPER_ARC = 16; // how far the peak rises above the base
  const BUMPER_R = 18;

  // t in [0,1] → unit rise above the base.
  //  - open on both sides: full hill (low → high → low)
  //  - touches left wall:  half-arc (high at wall → low at open end)
  //  - touches right wall: half-arc (low at open end → high at wall)
  //  - full-width:         shallow crown, ends stay high so neither
  //                        slope drives balls into a wall
  function bumperRise(t, edgeLeft, edgeRight){
    if(edgeLeft && edgeRight){
      return 0.85 + 0.15*Math.sin(Math.PI*t);
    }
    if(edgeLeft){
      // right half of a hill: peak at t=0, down to base at t=1
      return Math.cos(0.5*Math.PI*t);
    }
    if(edgeRight){
      // left half of a hill: base at t=0, peak at t=1
      return Math.sin(0.5*Math.PI*t);
    }
    // full arch with flat tangents at the open ends
    return 0.5 - 0.5*Math.cos(2*Math.PI*t);
  }

  function addBumperRun(startCol, endCol){
    const leftX = startCol*CELL + 8;
    const rightX = (endCol+1)*CELL - 8;
    const span = rightX - leftX;
    const edgeLeft = startCol === 0;
    const edgeRight = endCol === COLS-1;
    const samples = Math.max(6, Math.round(span / 14));
    const path = [];
    const pathBumpers = [];
    for(let i=0;i<=samples;i++){
      const t = i/samples;
      const x = leftX + span*t;
      const y = BUMPER_BASE_Y - BUMPER_ARC*bumperRise(t, edgeLeft, edgeRight);
      path.push({x,y});
      // every sample gets a collider so the arc has no gaps
      const bp = {x, y, r: BUMPER_R, hit:0};
      pathBumpers.push(bp);
      bumpers.push(bp);
    }
    bumperPaths.push({points: path, bumpers: pathBumpers, hit:0});
  }

  function recomputeBumpers(){
    bumpers = [];
    bumperPaths = [];
    let c = 0;
    while(c < COLS){
      if(colHeights[c] < ROWS){ c++; continue; }
      const start = c;
      while(c < COLS && colHeights[c] >= ROWS) c++;
      addBumperRun(start, c-1);
    }
  }

  // ---- column buttons ----
  const colsEl = document.getElementById('cols');
  colsEl.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
  const buttons = [];
  for(let c=0;c<COLS;c++){
    const b = document.createElement('button');
    b.className = 'colbtn';
    b.textContent = '▾';
    b.addEventListener('click', ()=>dropInColumn(c));
    colsEl.appendChild(b);
    buttons.push(b);
  }

  function inputBlocked(){
    return gameOver || resolving || detonateMode || (vsComputerEnabled && current===2);
  }

  function canChooseDetonate(){
    return detonateMode && !resolving && !gameOver && !(vsComputerEnabled && current===2);
  }

  // ---- match resolution (clear + cascade) state ----
  let resolving = false;
  let resolvePhase = null;   // 'flash' | 'explode' | 'wait'
  let resolvePhaseStart = 0;
  let currentGroups = [];
  let chainStep = 0;
  let flashCells = null;     // Set of "col,row" currently flashing before clear
  let particles = [];        // explosion debris from cleared pucks
  let popups = [];           // floating score/chain text
  const FLASH_MS = 480, EXPLODE_MS = 280;

  function refreshButtons(){
    const blocked = inputBlocked();
    for(let c=0;c<COLS;c++){
      buttons[c].disabled = blocked;
      buttons[c].classList.toggle('full', colHeights[c] >= ROWS);
    }
  }

  // ---- balls / animation state ----
  // multiple balls can be in flight at once — turns advance the instant a
  // ball is launched, not when it lands, so nobody has to wait
  let balls = [];
  let looping = false;
  let aimX = W/2;

  const BALL_RADIUS = 14;
  const HOLE_R = 29; // radius of the front-plate holes pucks are seen through
  const SAFETY_LIMIT = 420; // frames stuck in the peg field before we force it through

  function dropInColumn(col){
    if(inputBlocked()) return;
    dropAt(col*CELL + CELL/2);
  }

  // continuous drop: x can be anywhere along the top, not snapped to a column
  function dropAt(x){
    if(gameOver) return;
    if(colHeights.every(h=>h>=ROWS)) return; // board already fully committed
    const ball = {
      x: Math.max(BALL_RADIUS, Math.min(W-BALL_RADIUS, x)) + (Math.random()*6-3),
      y: 14,
      vx: (Math.random()*2-1),
      vy: 0.6,
      radius: BALL_RADIUS,
      phase: 'peg', // 'peg' -> 'grid'
      targetCol: null,
      row: null,
      player: current,
      frameSafety: 0,
      trail: []
    };
    balls.push(ball);
    startLoop();

    // turn advances right away — you don't have to wait for this piece to land
    current = current === 1 ? 2 : 1;
    updateTurnUI();
    refreshButtons();
    maybeTriggerAI();
  }

  function nearestOpenColumn(preferred){
    if(colHeights[preferred] < ROWS) return preferred;
    for(let d=1; d<COLS; d++){
      const l = preferred - d, r = preferred + d;
      if(l>=0 && colHeights[l] < ROWS) return l;
      if(r<COLS && colHeights[r] < ROWS) return r;
    }
    return preferred;
  }

  function startLoop(){
    if(!looping){
      looping = true;
      requestAnimationFrame(tick);
    }
  }

  function stepBall(ball, gravity){
    ball.frameSafety++;

    if(ball.phase === 'peg'){
      ball.vy += gravity;
      ball.vy = Math.min(ball.vy, 15);
      // turbulence: constant small random push so the ball never settles
      // into a stable back-and-forth groove between two pegs
      ball.vx += (Math.random()-0.5)*0.18;
      ball.vx = Math.max(-7, Math.min(7, ball.vx));
      ball.x += ball.vx;
      ball.y += ball.vy;

      if(ball.x - ball.radius < 0){
        ball.x = ball.radius;
        ball.vx = -ball.vx*0.7 + 1.2; // kick away from the wall so it can't hover in the corner
      }
      if(ball.x + ball.radius > W){
        ball.x = W - ball.radius;
        ball.vx = -ball.vx*0.7 - 1.2;
      }

      for(const p of pegs){
        const dx = ball.x - p.x, dy = ball.y - p.y;
        const dist = Math.hypot(dx,dy);
        const minDist = ball.radius + p.r;
        if(dist < minDist && dist > 0.0001){
          const nx = dx/dist, ny = dy/dist;
          ball.x = p.x + nx*minDist;
          ball.y = p.y + ny*minDist;
          const dot = ball.vx*nx + ball.vy*ny;
          ball.vx -= 2*dot*nx;
          ball.vy -= 2*dot*ny;
          ball.vx *= 0.88; ball.vy *= 0.88; // livelier bounce, less energy lost per hit
          ball.vx += (Math.random()*0.8-0.4);
          p.hit = 10;
        }
      }

      // bumpers over full columns: a real elastic bounce, kicked a little
      // harder than a peg so it reliably shoves the ball out of the
      // blocked column and back into open play
      for(const bp of bumpers){
        const dx = ball.x - bp.x, dy = ball.y - bp.y;
        const dist = Math.hypot(dx,dy);
        const minDist = ball.radius + bp.r;
        if(dist < minDist && dist > 0.0001){
          const nx = dx/dist, ny = dy/dist;
          ball.x = bp.x + nx*minDist;
          ball.y = bp.y + ny*minDist;
          const dot = ball.vx*nx + ball.vy*ny;
          ball.vx -= 2*dot*nx;
          ball.vy -= 2*dot*ny;
          ball.vx *= 1.05; ball.vy *= 1.05; // bumpers add energy, like a pinball kicker
          ball.vx += nx*1.4 + (Math.random()*0.8-0.4);
          ball.vy = Math.min(ball.vy, -1.5); // always shove back upward, never let it settle on top
          bp.hit = 14;
        }
      }

      // Blasted pucks traveling through the board face should bounce off
      // settled pieces instead of phasing through them.
      if(ball.y > PEG_ZONE - 20){
        collideBallWithSettledPieces(ball);
      }

      // Enter the grid once we're past the mouth AND falling — so an
      // explosion blast can travel up through the column and back into
      // the pegs without immediately re-committing to a slot. Watchdog
      // still force-enters if a ball is stuck forever in the peg field.
      if(ball.frameSafety > SAFETY_LIMIT || (ball.y > PEG_ZONE && ball.vy >= 0)){
        enterGridColumn(ball);
      }
    } else {
      // grid phase: real physics inside the column until the puck settles.
      // Column walls contain it sideways; settled pieces below act as static
      // circles to bounce on. A hard upward blast (from a clear) can send it
      // back out the top into the peg zone as a free physics object again.
      if(ball.y < PEG_ZONE - 8 && ball.vy < -0.5){
        releaseBallToPegs(ball);
      } else {
        stepGridBall(ball, gravity);
      }
    }

    ball.trail.push({x:ball.x, y:ball.y});
    if(ball.trail.length>10) ball.trail.shift();
  }

  function collideBallWithSettledPieces(ball){
    const PIECE_R = 32;
    for(let c=0;c<COLS;c++){
      const px = c*CELL + CELL/2;
      for(let i=0;i<stack[c].length;i++){
        const entry = stack[c][i];
        if(entry.type!=='piece') continue;
        const py = PEG_ZONE + (ROWS-1-i)*CELL + CELL/2;
        const dx = ball.x - px, dy = ball.y - py;
        const dist = Math.hypot(dx, dy);
        const minDist = ball.radius + PIECE_R - 4;
        if(dist < minDist && dist > 0.0001){
          const nx = dx/dist, ny = dy/dist;
          ball.x = px + nx*minDist;
          ball.y = py + ny*minDist;
          const dot = ball.vx*nx + ball.vy*ny;
          if(dot < 0){
            ball.vx -= 1.9*dot*nx;
            ball.vy -= 1.9*dot*ny;
          }
          ball.vx *= 0.9;
          ball.vy *= 0.9;
        }
      }
    }
  }

  function rebuildColumnFromStack(c){
    const col = Array(ROWS).fill(0);
    for(let i=0;i<stack[c].length;i++){
      const entry = stack[c][i];
      const row = ROWS - 1 - i;
      if(entry.type==='ball'){
        entry.row = row;
        entry.ball.row = row;
      } else {
        col[row] = entry.player;
      }
    }
    for(let r=0;r<ROWS;r++) grid[c][r] = col[r];
    colHeights[c] = stack[c].length;
  }

  const GRID_SETTLE_FRAMES = 360; // ~6s hard cap inside a column before we seat it

  function enterGridColumn(ball){
    ball.phase = 'grid';
    ball.y = Math.max(ball.y, PEG_ZONE + 1);
    const rawCol = Math.min(COLS-1, Math.max(0, Math.floor(ball.x / CELL)));
    const targetCol = nearestOpenColumn(rawCol);
    // reserve this slot immediately so other balls in flight — and any
    // clear pass — see an accurate, up-to-date stack
    const h = stack[targetCol].length;
    if(h >= ROWS){
      // nowhere to go (board filled under us) — keep knocking around in pegs
      ball.phase = 'peg';
      ball.y = PEG_ZONE - ball.radius;
      ball.vy = -Math.abs(ball.vy) - 2;
      return;
    }
    const row = ROWS - 1 - h;
    const entry = {type:'ball', ball, row};
    stack[targetCol].push(entry);
    colHeights[targetCol] = stack[targetCol].length;
    recomputeBumpers();
    ball.targetCol = targetCol;
    ball.row = row;
    ball.stackEntry = entry;
    ball.gridAge = 0;
    // kill leftover horizontal speed a bit so it commits to the slot
    ball.vx *= 0.55;
  }

  function releaseBallToPegs(ball){
    const col = ball.targetCol;
    if(ball.stackEntry && col!=null){
      const idx = stack[col].indexOf(ball.stackEntry);
      if(idx>=0) stack[col].splice(idx, 1);
      rebuildColumnFromStack(col);
      recomputeBumpers();
    }
    ball.stackEntry = null;
    ball.targetCol = null;
    ball.row = null;
    ball.phase = 'peg';
    ball.frameSafety = 0;
    ball.gridAge = 0;
  }

  function seatBall(ball){
    const targetX = ball.targetCol*CELL + CELL/2;
    const landingY = PEG_ZONE + ball.row*CELL + CELL/2;
    ball.x = targetX;
    ball.y = landingY;
    ball.vx = 0;
    ball.vy = 0;
    ball.landed = true;
  }

  function stepGridBall(ball, gravity){
    ball.gridAge = (ball.gridAge || 0) + 1;
    const targetX = ball.targetCol*CELL + CELL/2;
    const colLeft = ball.targetCol*CELL + ball.radius + 4;
    const colRight = (ball.targetCol+1)*CELL - ball.radius - 4;
    const landingY = PEG_ZONE + ball.row*CELL + CELL/2;

    // Hard unstick: if a puck has been bouncing in-column too long, just
    // seat it. Prevents two pucks wedging forever and freezing resolves.
    if(ball.gridAge > GRID_SETTLE_FRAMES){
      seatBall(ball);
      return;
    }

    ball.vy += gravity;
    ball.vy = Math.min(ball.vy, 20);
    ball.x += ball.vx;
    ball.y += ball.vy;

    if(ball.x < colLeft){ ball.x = colLeft; ball.vx = Math.abs(ball.vx)*0.35; }
    if(ball.x > colRight){ ball.x = colRight; ball.vx = -Math.abs(ball.vx)*0.35; }

    // Pull toward the hole center — stronger once near the seat so it
    // can't keep skating on top of the puck below forever.
    const nearSeat = ball.y > landingY - CELL*0.7;
    ball.vx += (targetX - ball.x) * (nearSeat ? 0.12 : 0.04);
    ball.vx *= nearSeat ? 0.9 : 0.98;

    // The reserved stack slot is authoritative: rest on that cell's floor.
    // (Circle-vs-settled-piece collision used to fight this seat and leave
    // two pucks oscillating mid-hole, which also blocked the resolve wait.)
    if(ball.y >= landingY){
      ball.y = landingY;
      if(ball.vy > 0) ball.vy = -ball.vy*0.28;
      ball.vx *= 0.65;
      if((Math.abs(ball.vy) < 1.5 && Math.abs(ball.vx) < 1.1 && Math.abs(ball.x-targetX) < 10)
         || ball.gridAge > GRID_SETTLE_FRAMES*0.55){
        seatBall(ball);
      }
    }
  }

  function resolveBallCollisions(){
    for(let i=0;i<balls.length;i++){
      for(let j=i+1;j<balls.length;j++){
        const a = balls[i], b = balls[j];
        // Same-column grid pucks already have reserved seats — colliding
        // them against each other wedges them between seat snap and
        // separation. Let the stack order handle those.
        if(a.phase==='grid' && b.phase==='grid' && a.targetCol===b.targetCol) continue;
        const dx = b.x-a.x, dy = b.y-a.y;
        const dist = Math.hypot(dx,dy);
        const minDist = a.radius+b.radius;
        if(dist < minDist && dist > 0.0001){
          const nx = dx/dist, ny = dy/dist;
          const overlap = (minDist-dist)/2;
          a.x -= nx*overlap; a.y -= ny*overlap;
          b.x += nx*overlap; b.y += ny*overlap;
          // equal-mass elastic collision: swap the velocity component along the normal
          const avn = a.vx*nx + a.vy*ny;
          const bvn = b.vx*nx + b.vy*ny;
          a.vx += (bvn-avn)*nx; a.vy += (bvn-avn)*ny;
          b.vx += (avn-bvn)*nx; b.vy += (avn-bvn)*ny;
        }
      }
    }
  }

  // Last-resort: any grid ball that somehow never seated gets forced down
  // so a resolve wait (or the drop loop) can never hang the game.
  function forceSeatStuckGridBalls(){
    let any = false;
    for(const b of balls){
      if(b.phase==='grid' && !b.landed && (b.gridAge || 0) > GRID_SETTLE_FRAMES){
        seatBall(b);
        any = true;
      }
    }
    return any;
  }

  function tick(){
    const gravity = 0.42;
    for(const p of pegs){ if(p.hit) p.hit--; }
    for(const bp of bumpers){ if(bp.hit) bp.hit--; }
    // propagate collider hits onto the drawn path so the whole arc flashes
    for(const path of bumperPaths){
      path.hit = 0;
      for(const bp of path.bumpers) if(bp.hit > path.hit) path.hit = bp.hit;
    }

    for(const ball of balls){
      stepBall(ball, gravity);
    }
    resolveBallCollisions();
    forceSeatStuckGridBalls();
    stepParticles();

    const landed = balls.filter(b=>b.landed);
    if(landed.length){
      balls = balls.filter(b=>!b.landed);
      for(const b of landed) finalizeDrop(b);
      // check for matches the moment any piece lands, even if other
      // balls are still bouncing through the peg zone
      if(!resolving) maybeStartResolve();
    }

    // Peg-zone orphans with nowhere to land (board full) would bounce
    // forever and freeze a resolve wait — cull them after a grace period.
    if(boardIsFull() && balls.length){
      const stuckPeg = balls.filter(b => b.phase==='peg' && b.frameSafety > SAFETY_LIMIT);
      if(stuckPeg.length){
        const cull = new Set(stuckPeg);
        balls = balls.filter(b => !cull.has(b));
      }
    }

    draw();

    if(balls.length>0 || particles.length>0){
      requestAnimationFrame(tick);
    } else {
      looping = false;
    }
  }

  function finalizeDrop(ball){
    const col = ball.targetCol, row = ball.row, player = ball.player;
    grid[col][row] = player;
    if(ball.stackEntry){
      ball.stackEntry.type = 'piece';
      ball.stackEntry.player = player;
      delete ball.stackEntry.ball;
    }
    refreshButtons();
  }

  // ---- match finding, scoring, clearing ----
  // Scans the whole board for every maximal run of 4+ same-player pieces,
  // in all four directions. Overlapping runs through the same cell (e.g. a
  // piece that completes both a row and a column) come back as separate
  // groups — that's what powers the "multiple simultaneously" bonus.
  function findMatches(){
    const dirs = [[1,0],[0,1],[1,1],[1,-1]];
    const groups = [];
    for(const [dx,dy] of dirs){
      const visited = new Set();
      for(let c=0;c<COLS;c++){
        for(let r=0;r<ROWS;r++){
          const key = c+','+r;
          if(visited.has(key)) continue;
          const player = grid[c][r];
          if(!player) continue;
          // only start a scan from the true beginning of a run in this direction
          const pc = c-dx, pr = r-dy;
          if(pc>=0 && pc<COLS && pr>=0 && pr<ROWS && grid[pc][pr]===player) continue;
          const cells = [];
          let cc=c, cr=r;
          while(cc>=0 && cc<COLS && cr>=0 && cr<ROWS && grid[cc][cr]===player){
            cells.push([cc,cr]);
            visited.add(cc+','+cr);
            cc+=dx; cr+=dy;
          }
          if(cells.length>=4) groups.push({player, cells});
        }
      }
    }
    return groups;
  }

  // 4-in-a-row = 1pt, each extra piece in the run = +1pt. Multiple separate
  // groups clearing for the same player in one pass add +1pt each on top.
  // Chain reactions (cascades from gravity after a clear) multiply the whole thing.
  function scoreGroups(groups, chainMultiplier){
    const pts = {1:0,2:0}, counts = {1:0,2:0};
    for(const g of groups){
      pts[g.player] += (g.cells.length - 3);
      counts[g.player]++;
    }
    for(const p of [1,2]) if(counts[p]>1) pts[p] += (counts[p]-1);
    for(const p of [1,2]) pts[p] *= chainMultiplier;
    return pts;
  }

  function spawnPopups(groups){
    const now = performance.now();
    for(const g of groups){
      const avgC = g.cells.reduce((s,c)=>s+c[0],0)/g.cells.length;
      const avgR = g.cells.reduce((s,c)=>s+c[1],0)/g.cells.length;
      const x = avgC*CELL+CELL/2;
      const y = PEG_ZONE + avgR*CELL + CELL/2;
      const base = (g.cells.length-3) * chainStep;
      popups.push({x, y, text:'+'+base, color: g.player===1?P1:P2, t0:now, duration:1000});
    }
    const counts = {1:0,2:0};
    for(const g of groups) counts[g.player]++;
    let bannerOffset = 0;
    if(chainStep>1){
      popups.push({x:W/2, y:PEG_ZONE*0.4, text:'CHAIN ×'+chainStep+'!', color:'#ffffff', t0:now, duration:1200, big:true});
      bannerOffset = 34;
    }
    for(const p of [1,2]){
      if(counts[p]>1){
        popups.push({x:W/2, y:PEG_ZONE*0.4+bannerOffset, text:(p===1?'RED':(vsComputerEnabled?'COMPUTER':'YELLOW'))+' COMBO ×'+counts[p], color:p===1?P1:P2, t0:now, duration:1200});
      }
    }
  }

  function spawnExplosion(x, y, player){
    const color = player===1 ? P1 : P2;
    for(let i=0;i<16;i++){
      const ang = Math.random()*Math.PI*2;
      const spd = 2.2 + Math.random()*6.5;
      particles.push({
        x, y,
        vx: Math.cos(ang)*spd,
        vy: Math.sin(ang)*spd - 3.5,
        r: 2.5 + Math.random()*5,
        color,
        life: 1,
        decay: 0.018 + Math.random()*0.025
      });
    }
    // a few larger bright shards
    for(let i=0;i<4;i++){
      const ang = -Math.PI/2 + (Math.random()-0.5)*1.4;
      const spd = 5 + Math.random()*5;
      particles.push({
        x, y,
        vx: Math.cos(ang)*spd,
        vy: Math.sin(ang)*spd,
        r: 5 + Math.random()*4,
        color: '#ffffff',
        life: 1,
        decay: 0.03 + Math.random()*0.02
      });
    }
  }

  function stepParticles(){
    for(const p of particles){
      p.vy += 0.25;
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.99;
      p.life -= p.decay;
    }
    particles = particles.filter(p => p.life > 0);
  }

  // Launch a settled (or in-flight) puck back into free physics. Strong
  // upward impulse so clears can fling pieces out of the column and into
  // the peg field — they'll re-enter a column when they fall again.
  function launchPuckFromCell(col, row, player, stackPos, fromClearIndex){
    const x = col*CELL + CELL/2 + (Math.random()*10-5);
    const y = PEG_ZONE + row*CELL + CELL/2;
    const heightBoost = Math.max(0, stackPos - fromClearIndex);
    // Depth-scaled impulse: higher stack pieces get thrown harder, and
    // deeper cells need more kick to have a chance of clearing the mouth.
    const depth = Math.max(0, row);
    const ball = {
      x, y,
      vx: (Math.random()-0.5)*8,
      vy: -(12 + Math.random()*5 + heightBoost*2.4 + depth*0.9),
      radius: BALL_RADIUS,
      phase: 'peg',
      targetCol: null,
      row: null,
      player,
      frameSafety: 0,
      trail: [],
      stackEntry: null
    };
    balls.push(ball);
  }

  // Matched cells explode into particles. Every puck stacked above a clear
  // in that column is blasted back into physics (often up into the pegs).
  // Survivors below the blast stay put — no Tetris slide; physics refills.
  function applyExplosionClear(groups){
    const cleared = new Set();
    for(const g of groups) for(const [c,r] of g.cells) cleared.add(c+','+r);

    for(const key of cleared){
      const [c,r] = key.split(',').map(Number);
      const player = grid[c][r];
      if(player) spawnExplosion(c*CELL+CELL/2, PEG_ZONE+r*CELL+CELL/2, player);
    }

    for(let c=0;c<COLS;c++){
      const oldStack = stack[c];
      let lowestClearedIdx = Infinity;
      for(let i=0;i<oldStack.length;i++){
        const oldRow = ROWS - 1 - i;
        if(oldStack[i].type==='piece' && cleared.has(c+','+oldRow)){
          lowestClearedIdx = Math.min(lowestClearedIdx, i);
        }
      }

      const survivors = [];
      for(let i=0;i<oldStack.length;i++){
        const entry = oldStack[i];
        const oldRow = ROWS - 1 - i;
        if(entry.type==='piece' && cleared.has(c+','+oldRow)){
          continue; // destroyed in the explosion
        }
        if(lowestClearedIdx !== Infinity && i > lowestClearedIdx){
          // above the blast — fling back into play
          if(entry.type==='piece'){
            launchPuckFromCell(c, oldRow, entry.player, i, lowestClearedIdx);
          } else if(entry.type==='ball'){
            const b = entry.ball;
            b.vx += (Math.random()-0.5)*6;
            b.vy = Math.min(b.vy, 0) - (8 + Math.random()*4 + (i-lowestClearedIdx)*1.5);
            b.stackEntry = null;
            b.targetCol = null;
            b.row = null;
            b.phase = 'peg';
            b.frameSafety = 0;
            b.gridAge = 0;
          }
          continue;
        }
        survivors.push(entry);
      }

      stack[c] = survivors;
      rebuildColumnFromStack(c);
    }
    recomputeBumpers();
    startLoop(); // keep the loop alive for launched pucks and debris
  }

  function boardIsFull(){
    return colHeights.every(h=>h>=ROWS);
  }

  let detonateAnim = false;
  function startDetonateAnim(){
    if(detonateAnim) return;
    detonateAnim = true;
    const step = ()=>{
      if(!detonateMode){ detonateAnim = false; return; }
      draw();
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  function enterDetonateMode(){
    detonateMode = true;
    detonateHover = null;
    gameOver = false;
    banner.classList.remove('show');
    refreshButtons();
    updateTurnUI();
    startDetonateAnim();
    maybeTriggerAIDetonate();
  }

  // Board-full escape hatch: blow up one settled piece (no points), flinging
  // everything above it back into physics — same blast as a match clear.
  function beginDetonate(col, row){
    if(!detonateMode || resolving) return;
    if(col<0 || col>=COLS || row<0 || row>=ROWS) return;
    if(!grid[col][row]) return;
    detonateMode = false;
    detonateHover = null;
    detonateConsumesTurn = true;
    resolving = true;
    chainStep = 0;
    currentGroups = [{player: grid[col][row], cells:[[col,row]], detonate:true}];
    flashCells = new Set([col+','+row]);
    resolvePhase = 'flash';
    resolvePhaseStart = performance.now();
    refreshButtons();
    requestAnimationFrame(resolveTick);
  }

  function cellAtCanvasPos(x, y){
    if(y < PEG_ZONE) return null;
    const col = Math.floor(x / CELL);
    const row = Math.floor((y - PEG_ZONE) / CELL);
    if(col<0 || col>=COLS || row<0 || row>=ROWS) return null;
    if(!grid[col][row]) return null;
    // require a click near the puck itself, not just anywhere in the cell
    const cx = col*CELL + CELL/2;
    const cy = PEG_ZONE + row*CELL + CELL/2;
    if(Math.hypot(x-cx, y-cy) > HOLE_R) return null;
    return {col, row};
  }

  function maybeStartResolve(){
    if(gameOver) return;
    const groups = findMatches();
    if(groups.length>0){
      beginResolveChain(groups);
    } else {
      if(boardIsFull()){
        enterDetonateMode();
      } else {
        afterBoardQuiet();
      }
    }
  }

  // Shared end-of-cascade bookkeeping: pass the turn if a detonation was
  // the action that got us here, then let the next player drop (or AI).
  function afterBoardQuiet(){
    if(detonateConsumesTurn){
      current = current === 1 ? 2 : 1;
      detonateConsumesTurn = false;
      updateTurnUI();
    }
    refreshButtons();
    maybeTriggerAI();
  }

  function beginResolveChain(groups){
    resolving = true;
    chainStep = 0;
    refreshButtons();
    enterFlash(groups);
    requestAnimationFrame(resolveTick);
  }

  function enterFlash(groups){
    chainStep++;
    currentGroups = groups;
    flashCells = new Set();
    for(const g of groups) for(const [c,r] of g.cells) flashCells.add(c+','+r);
    resolvePhase = 'flash';
    resolvePhaseStart = performance.now();
  }

  function finishResolveOrChain(){
    const nextGroups = findMatches();
    if(nextGroups.length>0){
      enterFlash(nextGroups);
    } else {
      resolving = false;
      chainStep = 0;
      if(boardIsFull()){
        // Still packed after the blast — other player picks the next piece.
        if(detonateConsumesTurn){
          current = current === 1 ? 2 : 1;
          detonateConsumesTurn = false;
          updateTurnUI();
        }
        enterDetonateMode();
      } else {
        afterBoardQuiet();
      }
    }
  }

  function resolveTick(){
    const now = performance.now();
    if(resolving){
      const elapsed = now - resolvePhaseStart;
      if(resolvePhase==='flash'){
        if(elapsed >= FLASH_MS){
          const isDetonate = currentGroups.some(g => g.detonate);
          if(!isDetonate){
            const pts = scoreGroups(currentGroups, chainStep);
            scores[1]+=pts[1]; scores[2]+=pts[2];
            updateScoreUI();
            spawnPopups(currentGroups);
          } else {
            const g = currentGroups[0];
            const [c,r] = g.cells[0];
            popups.push({
              x: c*CELL+CELL/2,
              y: PEG_ZONE + r*CELL + CELL/2,
              text: 'BOOM!',
              color: '#ffffff',
              t0: performance.now(),
              duration: 900,
              big: true
            });
          }
          applyExplosionClear(currentGroups);
          flashCells = null;
          resolvePhase = 'explode';
          resolvePhaseStart = now;
        }
      } else if(resolvePhase==='explode'){
        // brief beat for the blast to read, then wait on physics
        if(elapsed >= EXPLODE_MS){
          resolvePhase = 'wait';
          resolvePhaseStart = now;
        }
      } else if(resolvePhase==='wait'){
        // launched pucks must fully settle before the next cascade check —
        // they may still be bouncing around in the pegs. Also force-seat
        // any grid puck that wedged (so a stuck pair can't freeze input).
        forceSeatStuckGridBalls();
        if(balls.length===0){
          finishResolveOrChain();
        } else if(elapsed > 8000){
          // Absolute failsafe: seat or discard whatever is left and move on
          for(const b of balls){
            if(b.phase==='grid' && b.targetCol!=null && b.row!=null) seatBall(b);
          }
          balls = balls.filter(b => b.phase==='grid'); // drop peg orphans
          // tick will finalize seated balls; if none left, finish now
          if(balls.every(b=>b.landed) || balls.length===0){
            const landedNow = balls.filter(b=>b.landed);
            balls = balls.filter(b=>!b.landed);
            for(const b of landedNow) finalizeDrop(b);
            finishResolveOrChain();
          }
        }
      }
    }
    draw();
    const popupsAlive = popups.some(p => performance.now()-p.t0 < p.duration);
    if(resolving || popupsAlive){
      requestAnimationFrame(resolveTick);
    }
  }

  function checkWin(col,row,player){
    const dirs = [[1,0],[0,1],[1,1],[1,-1]];
    for(const [dx,dy] of dirs){
      let cells = [[col,row]];
      for(const sign of [1,-1]){
        let c = col+dx*sign, r = row+dy*sign;
        while(c>=0 && c<COLS && r>=0 && r<ROWS && grid[c][r]===player){
          cells.push([c,r]);
          c += dx*sign; r += dy*sign;
        }
      }
      if(cells.length>=4) return cells;
    }
    return null;
  }

  // ---- computer player ----
  function wouldWin(col, player){
    if(colHeights[col] >= ROWS) return false;
    const row = ROWS - 1 - colHeights[col];
    grid[col][row] = player;
    const result = checkWin(col, row, player);
    grid[col][row] = 0;
    return !!result;
  }

  function chooseAiColumn(){
    const open = [];
    for(let c=0;c<COLS;c++) if(colHeights[c] < ROWS) open.push(c);
    if(open.length===0) return null;
    // take a winning move if there is one
    for(const c of open) if(wouldWin(c, 2)) return c;
    // otherwise block the human's winning move
    for(const c of open) if(wouldWin(c, 1)) return c;
    // otherwise favor central columns, with some randomness
    const center = (COLS-1)/2;
    const weights = open.map(c=>1/(1+Math.abs(c-center)));
    const total = weights.reduce((a,b)=>a+b,0);
    let r = Math.random()*total;
    for(let i=0;i<open.length;i++){
      r -= weights[i];
      if(r<=0) return open[i];
    }
    return open[open.length-1];
  }

  function maybeTriggerAI(){
    if(!vsComputerEnabled || gameOver || resolving || detonateMode || current!==2) return;
    const delay = 450 + Math.random()*550;
    setTimeout(()=>{
      if(!vsComputerEnabled || gameOver || resolving || detonateMode || current!==2) return;
      const col = chooseAiColumn();
      if(col===null) return;
      const x = col*CELL + CELL/2 + (Math.random()*36-18);
      dropAt(x);
    }, delay);
  }

  // Prefer blowing up the opponent's pieces that have a tall stack above
  // them — more chaos, better chance the board opens up for the computer.
  function chooseAiDetonateCell(){
    const picks = [];
    for(let c=0;c<COLS;c++){
      for(let r=0;r<ROWS;r++){
        if(!grid[c][r]) continue;
        const above = r; // rows above this cell (0 = top)
        const oppBonus = grid[c][r] === 1 ? 2.5 : 1;
        const weight = (1 + above*1.4) * oppBonus;
        picks.push({c, r, weight});
      }
    }
    if(!picks.length) return null;
    const total = picks.reduce((s,p)=>s+p.weight, 0);
    let roll = Math.random()*total;
    for(const p of picks){
      roll -= p.weight;
      if(roll <= 0) return p;
    }
    return picks[picks.length-1];
  }

  function maybeTriggerAIDetonate(){
    if(!vsComputerEnabled || !detonateMode || resolving || gameOver || current!==2) return;
    const delay = 550 + Math.random()*700;
    setTimeout(()=>{
      if(!vsComputerEnabled || !detonateMode || resolving || gameOver || current!==2) return;
      const pick = chooseAiDetonateCell();
      if(!pick) return;
      beginDetonate(pick.c, pick.r);
    }, delay);
  }

  // ---- drawing ----
  function draw(){
    ctx.clearRect(0,0,W,H);

    // peg zone bg
    const grad = ctx.createLinearGradient(0,0,0,PEG_ZONE);
    grad.addColorStop(0, '#1a1630');
    grad.addColorStop(1, PANEL2);
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,PEG_ZONE);

    // subtle column guides in peg zone
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    for(let c=1;c<COLS;c++){
      ctx.beginPath();
      ctx.moveTo(c*CELL,0);
      ctx.lineTo(c*CELL,PEG_ZONE);
      ctx.stroke();
    }

    // pegs
    for(const p of pegs){
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = p.hit ? '#ffffff' : PEG;
      ctx.shadowColor = PEG;
      ctx.shadowBlur = p.hit ? 18 : 6;
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // bumpers — continuous arched rails over runs of full columns
    const BUMPER_COLOR = '#FF6B4D';
    for(const path of bumperPaths){
      const pts = path.points;
      if(pts.length < 2) continue;
      const hit = path.hit > 0;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.strokeStyle = hit ? '#ffffff' : BUMPER_COLOR;
      ctx.lineWidth = BUMPER_R * 2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.shadowColor = BUMPER_COLOR;
      ctx.shadowBlur = hit ? 28 : 12;
      ctx.stroke();
      // inner highlight so the rail reads as a solid bumper, not a flat stroke
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.strokeStyle = hit ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.35)';
      ctx.lineWidth = BUMPER_R * 0.7;
      ctx.shadowBlur = 0;
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.lineCap = 'butt';
    ctx.lineJoin = 'miter';

    // trails
    for(const b of balls){
      for(let i=0;i<b.trail.length;i++){
        const t = b.trail[i];
        const alpha = (i+1)/b.trail.length * 0.25;
        ctx.beginPath();
        ctx.arc(t.x,t.y,20,0,Math.PI*2);
        ctx.fillStyle = b.player===1 ? `rgba(255,77,109,${alpha})` : `rgba(255,210,63,${alpha})`;
        ctx.fill();
      }
    }

    // pucks still bouncing through the peg zone render normally, in front of the pegs
    for(const b of balls){
      if(b.phase!=='grid') drawPiece(b.x,b.y,b.player,true);
    }

    // ---- grid zone ----
    // Pucks live behind a solid front plate and are only visible through
    // the round holes punched in it — like a real Connect Four board.
    // So: fill a backdrop, draw every puck (landed, flashing, sliding
    // after a clear, or still dropping in) at its real position, THEN lay
    // the plate over the top and cut a hole at every slot. Anything not
    // lined up with a hole gets hidden behind the plastic.
    ctx.fillStyle = BG;
    ctx.fillRect(0,PEG_ZONE,W,H-PEG_ZONE);

    const flashElapsed = resolvePhase==='flash' ? Math.min(1,(performance.now()-resolvePhaseStart)/FLASH_MS) : 0;
    const detonatePulse = detonateMode ? 0.5 + 0.5*Math.sin(performance.now()/180) : 0;
    for(let c=0;c<COLS;c++){
      for(let r=0;r<ROWS;r++){
        const val = grid[c][r];
        if(val===0) continue;
        const cx = c*CELL+CELL/2, cy = PEG_ZONE + r*CELL + CELL/2;
        const key = c+','+r;
        if(flashCells && flashCells.has(key)){
          drawFlashPiece(cx,cy,val,flashElapsed);
        } else {
          const hovered = detonateMode && detonateHover && detonateHover.col===c && detonateHover.row===r;
          drawPiece(cx,cy,val, false, hovered ? 1 : detonatePulse*0.35);
        }
      }
    }

    // pucks currently dropping through the grid zone — same treatment,
    // they'll flash into view only as they pass behind each hole
    for(const b of balls){
      if(b.phase==='grid') drawPiece(b.x,b.y,b.player,true);
    }

    // the perforated front plate itself — built on the offscreen buffer,
    // then stamped onto the main canvas on top of the pucks
    plateCtx.clearRect(0,PEG_ZONE,W,H-PEG_ZONE);
    plateCtx.fillStyle = PANEL;
    plateCtx.fillRect(0,PEG_ZONE,W,H-PEG_ZONE);
    plateCtx.globalCompositeOperation = 'destination-out';
    for(let c=0;c<COLS;c++){
      for(let r=0;r<ROWS;r++){
        const cx = c*CELL+CELL/2, cy = PEG_ZONE + r*CELL + CELL/2;
        plateCtx.beginPath();
        plateCtx.arc(cx,cy,HOLE_R,0,Math.PI*2);
        plateCtx.fill();
      }
    }
    plateCtx.globalCompositeOperation = 'source-over';

    // hole rims, for a bit of physical depth — drawn on the same buffer
    for(let c=0;c<COLS;c++){
      for(let r=0;r<ROWS;r++){
        const cx = c*CELL+CELL/2, cy = PEG_ZONE + r*CELL + CELL/2;
        plateCtx.beginPath();
        plateCtx.arc(cx,cy,HOLE_R,0,Math.PI*2);
        plateCtx.lineWidth = 4;
        plateCtx.strokeStyle = 'rgba(0,0,0,0.55)';
        plateCtx.stroke();
        plateCtx.beginPath();
        plateCtx.arc(cx,cy,HOLE_R-2.5,0,Math.PI*2);
        plateCtx.lineWidth = 1.5;
        plateCtx.strokeStyle = 'rgba(255,255,255,0.07)';
        plateCtx.stroke();
      }
    }

    ctx.drawImage(plateCanvas, 0, 0);

    // explosion debris — on top of the plate so the blast reads clearly
    for(const p of particles){
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;

    // score/chain popups — always fully visible, drawn on top of the plate
    const nowP = performance.now();
    popups = popups.filter(p => nowP - p.t0 < p.duration);
    for(const p of popups){
      const t = (nowP - p.t0) / p.duration;
      const alpha = t < 0.7 ? 1 : Math.max(0, 1-(t-0.7)/0.3);
      const dy = -30*t;
      ctx.globalAlpha = alpha;
      ctx.font = (p.big ? 'bold 26px' : 'bold 18px') + " 'Space Grotesk', sans-serif";
      ctx.textAlign = 'center';
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.fillText(p.text, p.x, p.y+dy);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    // aim marker — shows exactly where the next drop will start
    if(!gameOver && !detonateMode){
      const c = current===1 ? P1 : P2;
      ctx.beginPath();
      ctx.moveTo(aimX-9, 6);
      ctx.lineTo(aimX+9, 6);
      ctx.lineTo(aimX, 20);
      ctx.closePath();
      ctx.fillStyle = c;
      ctx.shadowColor = c;
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // board-full prompt: pick a piece to detonate
    if(detonateMode && !resolving){
      const who = current===1 ? 'Red' : (vsComputerEnabled ? 'Computer' : 'Yellow');
      const msg = (vsComputerEnabled && current===2)
        ? 'Board full — Computer is picking a piece…'
        : `Board full — ${who}, click a piece to blow up`;
      ctx.save();
      ctx.font = "bold 18px 'Space Grotesk', sans-serif";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const tw = ctx.measureText(msg).width;
      const px = W/2, py = PEG_ZONE * 0.42;
      ctx.fillStyle = 'rgba(11,10,20,0.72)';
      ctx.beginPath();
      // rounded pill behind the prompt
      const rw = tw/2 + 18, rh = 18;
      ctx.moveTo(px-rw+rh, py-rh);
      ctx.arcTo(px+rw, py-rh, px+rw, py+rh, rh);
      ctx.arcTo(px+rw, py+rh, px-rw, py+rh, rh);
      ctx.arcTo(px-rw, py+rh, px-rw, py-rh, rh);
      ctx.arcTo(px-rw, py-rh, px+rw, py-rh, rh);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = current===1 ? P1 : P2;
      ctx.shadowBlur = 12;
      ctx.fillText(msg, px, py);
      ctx.restore();
    }
  }

  function drawFlashPiece(cx,cy,player,elapsedFrac){
    const base = player===1? P1 : P2;
    const pulse = 1 + 0.18*Math.sin(elapsedFrac*Math.PI*7);
    ctx.beginPath();
    ctx.arc(cx,cy,32*pulse,0,Math.PI*2);
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = base;
    ctx.shadowBlur = 30;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.lineWidth = 3;
    ctx.strokeStyle = base;
    ctx.stroke();
  }

  function drawPiece(cx,cy,player,isBall, highlight){
    const base = player===1? P1 : P2;
    const dark = player===1? P1D : P2D;
    ctx.beginPath();
    ctx.arc(cx,cy,32,0,Math.PI*2);
    ctx.fillStyle = base;
    if(isBall){ ctx.shadowColor = base; ctx.shadowBlur = 14; }
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.lineWidth = 3;
    ctx.strokeStyle = dark;
    ctx.stroke();
    if(highlight){
      ctx.beginPath();
      ctx.arc(cx,cy,34,0,Math.PI*2);
      ctx.strokeStyle = `rgba(255,255,255,${0.25 + 0.55*highlight})`;
      ctx.lineWidth = 3;
      ctx.stroke();
      if(highlight > 0.7){
        ctx.beginPath();
        ctx.arc(cx,cy,28,0,Math.PI*2);
        ctx.strokeStyle = `rgba(255,255,255,${0.35*highlight})`;
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }
  }

  // ---- UI wiring ----
  const s1El = document.getElementById('s1'), s2El = document.getElementById('s2');
  const score1El = document.getElementById('score1'), score2El = document.getElementById('score2');
  const banner = document.getElementById('banner');
  const bannerText = document.getElementById('bannerText');
  const p2Label = document.getElementById('p2Label');
  const vsComputerToggle = document.getElementById('vsComputerToggle');

  function updateScoreUI(){
    s1El.textContent = scores[1];
    s2El.textContent = scores[2];
  }
  function updateTurnUI(){
    score1El.classList.toggle('active', current===1);
    score2El.classList.toggle('active', current===2);
  }
  function showBanner(){
    const p2Name = vsComputerEnabled ? 'Computer' : 'Yellow';
    if(scores[1] > scores[2]){
      bannerText.textContent = `Board's full — Red wins, ${scores[1]}–${scores[2]}!`;
    } else if(scores[2] > scores[1]){
      bannerText.textContent = `Board's full — ${p2Name} wins, ${scores[2]}–${scores[1]}!`;
    } else {
      bannerText.textContent = `Board's full — tied at ${scores[1]}!`;
    }
    banner.classList.add('show');
  }

  document.getElementById('playAgain').addEventListener('click', ()=>{
    banner.classList.remove('show');
    freshState();
    updateTurnUI();
    refreshButtons();
    draw();
  });
  document.getElementById('resetScores').addEventListener('click', ()=>{
    scores = {1:0,2:0};
    updateScoreUI();
  });

  vsComputerToggle.addEventListener('change', ()=>{
    vsComputerEnabled = vsComputerToggle.checked;
    p2Label.textContent = vsComputerEnabled ? 'Computer' : 'Yellow';
    updateTurnUI();
    refreshButtons();
    maybeTriggerAI(); // in case it's already the computer's turn
    maybeTriggerAIDetonate();
  });

  // ---- continuous aim/drop on the canvas ----
  function canvasPos(evt){
    const rect = canvas.getBoundingClientRect();
    const src = evt.touches ? evt.touches[0] : evt;
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    return {
      x: (src.clientX - rect.left) * scaleX,
      y: (src.clientY - rect.top) * scaleY
    };
  }
  function canvasX(evt){ return canvasPos(evt).x; }

  canvas.addEventListener('mousemove', (e)=>{
    if(canChooseDetonate()){
      const {x,y} = canvasPos(e);
      const cell = cellAtCanvasPos(x,y);
      const same = (!cell && !detonateHover) ||
        (cell && detonateHover && cell.col===detonateHover.col && cell.row===detonateHover.row);
      detonateHover = cell;
      canvas.style.cursor = cell ? 'crosshair' : 'default';
      if(!same) draw();
      return;
    }
    if(inputBlocked() || pointerDown) return;
    aimX = Math.max(BALL_RADIUS, Math.min(W-BALL_RADIUS, canvasX(e)));
    canvas.style.cursor = 'pointer';
    draw();
  });

  let pointerDown = false;
  let pointerDetonate = false;
  canvas.addEventListener('pointerdown', (e)=>{
    if(canChooseDetonate()){
      const {x,y} = canvasPos(e);
      const cell = cellAtCanvasPos(x,y);
      if(cell){
        pointerDetonate = true;
        detonateHover = cell;
        canvas.setPointerCapture(e.pointerId);
        draw();
      }
      return;
    }
    if(inputBlocked()) return;
    pointerDown = true;
    canvas.setPointerCapture(e.pointerId);
    aimX = Math.max(BALL_RADIUS, Math.min(W-BALL_RADIUS, canvasX(e)));
    draw();
  });
  canvas.addEventListener('pointermove', (e)=>{
    if(pointerDetonate){
      e.preventDefault();
      const {x,y} = canvasPos(e);
      detonateHover = cellAtCanvasPos(x,y);
      draw();
      return;
    }
    if(!pointerDown) return;
    e.preventDefault();
    aimX = Math.max(BALL_RADIUS, Math.min(W-BALL_RADIUS, canvasX(e)));
    draw();
  });
  function releasePointer(e){
    if(pointerDetonate){
      pointerDetonate = false;
      if(canChooseDetonate()){
        const {x,y} = canvasPos(e || {clientX:0,clientY:0, touches:null});
        // prefer the hovered cell from last move; fall back to event pos
        const cell = detonateHover || (e ? cellAtCanvasPos(x,y) : null);
        if(cell) beginDetonate(cell.col, cell.row);
      }
      return;
    }
    if(!pointerDown) return;
    pointerDown = false;
    if(!inputBlocked()) dropAt(aimX);
  }
  canvas.addEventListener('pointerup', releasePointer);
  canvas.addEventListener('pointercancel', ()=>{
    pointerDown = false;
    pointerDetonate = false;
  });
  canvas.style.cursor = 'pointer';
  canvas.style.touchAction = 'none';

  freshState();
  updateTurnUI();
  updateScoreUI();
  refreshButtons();
  draw();
})();
</script>
</body>
</html>
