    });
    if(!resolving && !looping) startLoop();
  }

  function formatNum(n){
    if(!Number.isFinite(n)) return '—';
    if(n < 1000) return String(Math.floor(n));
    if(n < 10000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'k';
    if(n < 1e6) return Math.floor(n/1000) + 'k';
    if(n < 1e9) return (n/1e6).toFixed(2).replace(/\.?0+$/,'') + 'M';
    return (n/1e9).toFixed(2).replace(/\.?0+$/,'') + 'B';
  }

  function formatInterval(ms){
    if(!Number.isFinite(ms)) return 'off';
    if(ms >= 1000) return (ms/1000).toFixed(ms >= 2500 ? 1 : 2).replace(/\.0$/,'') + 's';
    return Math.round(ms) + 'ms';
  }

  function upgradeEffectText(def){
    const lvl = upgradeLevel(def.id);
    switch(def.id){
      case 'autoDealer':
        return lvl ? ('Every ' + formatInterval(autoDropIntervalMs())) : 'Manual only';
      case 'multiDeal':
        return (1 + lvl) + ' card' + (1+lvl === 1 ? '' : 's') + '/tick';
      case 'bigBlind':
        return '×' + scoreMultiplier().toFixed(2).replace(/\.00$/,'');
      case 'hotStreak':
        return lvl ? ('+' + lvl + ' chain') : 'No bonus';
      case 'pinPayout':
        return lvl ? ('+' + pinHitPayout() + ' / peg') : 'No payout';
      case 'bumperPayout':
        return lvl ? ('+' + bumperHitPayout() + ' / bumper') : 'No payout';
      case 'floorPayout':
        return lvl ? ('+' + floorClearPayout() + ' / clear') : 'No payout';
      case 'highCut': {
        if(!lvl) return 'Ranks A–K';
        const minR = minKeptRank();
        if(minR >= 10) return 'A, 10–K only';
        return 'A, ' + minR + '–K';
      }
      case 'suitCut': {
        if(!lvl) return 'All four suits';
        const left = activeSuits().join('');
        const gone = SUIT_CUT_ORDER.slice(0, lvl).join('');
        return 'Out ' + gone + ' · In ' + left;
      }
      case 'suitBomb':
        return lvl
          ? ('Cooldown ' + formatInterval(suitBombCooldownMs()))
          : 'Locked';
      case 'autoSuitBomb':
        return lvl ? 'Auto-casting' : (upgradeLevel('suitBomb') ? 'Manual only' : 'Needs Suit Purge');
      case 'cardSense':
        return lvl ? 'Aiming near hands' : 'Random columns';
      case 'feltGrease':
        return '×' + physicsSpeed().toFixed(2).replace(/\.00$/,'') + ' speed';
      default:
        return '';
    }
  }

  function persistSave(){
    try{
      const now = performance.now();
      const cdLeft = Math.max(0, suitBombReadyAt - now);
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        score, lifetime, upgrades, suitBombCdLeft: cdLeft, v: 1
      }));
    }catch(_){ /* private mode / quota */ }
  }

  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persistSave, 200);
  }

  function loadSave(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(!raw) return;
      const data = JSON.parse(raw);
      if(!data || typeof data !== 'object') return;
      if(typeof data.score === 'number' && data.score >= 0) score = Math.floor(data.score);
      if(typeof data.lifetime === 'number' && data.lifetime >= 0) lifetime = Math.floor(data.lifetime);
      if(data.upgrades && typeof data.upgrades === 'object'){
        for(const def of UPGRADE_DEFS){
          const v = data.upgrades[def.id];
          if(typeof v === 'number' && v >= 0){
            upgrades[def.id] = Math.min(def.maxLevel, Math.floor(v));
          }
        }
      }
      if(typeof data.suitBombCdLeft === 'number' && data.suitBombCdLeft > 0){
        suitBombReadyAt = performance.now() + data.suitBombCdLeft;
      } else {
        suitBombReadyAt = performance.now();
      }
    }catch(_){ /* corrupt save */ }
  }

  function resetProgress(){
    score = 0;
    lifetime = 0;
    upgrades = Object.fromEntries(UPGRADE_DEFS.map(u => [u.id, 0]));
    lastAutoDropAt = 0;
    suitBombReadyAt = 0;
    pendingSuitBomb = null;
    persistSave();
    updateScoreUI();
    updateShopUI();
    updateAutoStatus();
    updateSuitBombUI(performance.now(), true);
  }

  function buyUpgrade(id){
    const def = UPGRADE_DEFS.find(u => u.id === id);
    if(!def) return;
    if(id === 'autoSuitBomb' && !suitBombUnlocked()) return;
    const lvl = upgradeLevel(id);
    if(lvl >= def.maxLevel) return;
    const cost = upgradeCost(def);
    if(score < cost) return;
    score -= cost;
    upgrades[id] = lvl + 1;
    if(id === 'highCut' || id === 'suitCut') reshapeShoe();
    if(id === 'suitBomb' && lvl === 0){
      suitBombReadyAt = performance.now();
    }
    scheduleSave();
    updateScoreUI();
    updateShopUI();
    updateAutoStatus();
    updateSuitBombUI(performance.now(), true);
  }

  function columnReservations(){
    const reserved = Array(COLS).fill(0);
    for(const b of balls){
      if(b.targetCol != null) reserved[b.targetCol]++;
      else if(b.phase === 'peg' && b.autoCol != null) reserved[b.autoCol]++;
    }
    return reserved;
  }

  function pickAutoColumn(reserved){
    const open = [];
    for(let c=0;c<COLS;c++){
      if(colHeights[c] + reserved[c] < ROWS) open.push(c);
    }
    if(!open.length) return -1;
    if(!upgradeLevel('cardSense')){
      return open[(Math.random()*open.length)|0];
    }
    // Prefer columns that sit on a near-miss empty cell, then any open col.
    const hints = findNearMisses();
    const scores = Object.fromEntries(open.map(c => [c, Math.random()*0.3]));
    for(const h of hints){
      for(const [c, r] of h.cells){
        if(grid[c][r]) continue;
        const nextRow = colHeights[c] + reserved[c];
        if(nextRow !== r) continue;
        if(scores[c] === undefined) continue;
        scores[c] += 2 + (h.priority || 0) * 0.15;
      }
    }
    let best = open[0], bestScore = -1;
    for(const c of open){
      if(scores[c] > bestScore){ bestScore = scores[c]; best = c; }
    }
    return best;
  }

  function tryAutoDrop(now){
    const interval = autoDropIntervalMs();
    if(!Number.isFinite(interval)) return;
    if(gameOver || resolving) return;
    if(now - lastAutoDropAt < interval) return;
    if(balls.length >= MAX_IN_FLIGHT) return;
    if(colHeights.every(h => h >= ROWS)) return;

    const count = Math.min(autoDropCount(), MAX_IN_FLIGHT - balls.length);
    const reserved = columnReservations();
    let dropped = 0;
    for(let i=0;i<count;i++){
      if(balls.length >= MAX_IN_FLIGHT) break;
      const col = pickAutoColumn(reserved);
      if(col < 0) break;
      dropAt(col*CELL + CELL/2, {autoCol: col});
      reserved[col]++;
      dropped++;
    }
    if(dropped > 0) lastAutoDropAt = now;
  }

  function freshState(){
    grid = Array.from({length:COLS}, ()=>Array(ROWS).fill(0));
    colHeights = Array(COLS).fill(0);
    stack = Array.from({length:COLS}, ()=>[]);
    gameOver = false;
    balls = [];
    resolving = false;
    resolvePhase = null;
    currentGroups = [];
    chainStep = 0;
    pendingChain = 0;
    flashCells = null;
    particles = [];
    popups = [];
    pendingSuitBomb = null;
    lastAutoDropAt = performance.now();
    shoe = makeDeck().concat(makeDeck());
    nextCard = dealCard();
    updateNextUI();
    recomputeBumpers();
  }

  // ---- pegs ----
  const pegs = [];
  (function buildPegs(){
    const rows = 6;
    const topPad = 50, rowGap = 54;
    for(let r=0;r<rows;r++){
      const y = topPad + r*rowGap;
      const isEven = r % 2 === 0;
      const offset = isEven ? 0 : CELL/2;
      const cMin = 0, cMax = isEven ? COLS-1 : COLS-2;
      const isBottom = r === rows - 1;
      for(let c=cMin;c<=cMax;c++){
        const x = offset + c*CELL + CELL/2;
        const jx = (Math.random()*8-4);
        const jy = isBottom ? 0 : (Math.random()*5-2.5);
        pegs.push({x: x+jx, y: y+jy, r: 6});
      }
    }
  })();

  // ---- bumpers ----
  let bumperPaths = [];
  const BUMPER_BASE_Y = PEG_ZONE - 14;
  const BUMPER_ARC = 18;
  const BUMPER_R = 18;
  const BUMPER_EDGE_PAD = BUMPER_R + 16;

  function normalizeArcDelta(a0, a1){
    let delta = a1 - a0;
    while(delta > Math.PI) delta -= Math.PI*2;
    while(delta < -Math.PI) delta += Math.PI*2;
    return delta;
  }

  function closestPointOnArc(px, py, arc){
    const {cx, cy, r, a0, a1} = arc;
    const delta = a1 - a0;
    let off = Math.atan2(py - cy, px - cx) - a0;
    while(off > Math.PI) off -= Math.PI*2;
    while(off < -Math.PI) off += Math.PI*2;
    let t = 0;
    if(Math.abs(delta) > 1e-9){
      t = Math.max(0, Math.min(1, off / delta));
    }
    const a = a0 + delta*t;
    return {x: cx + Math.cos(a)*r, y: cy + Math.sin(a)*r};
  }

  function closestPointOnSegment(px, py, x1, y1, x2, y2){
    const dx = x2 - x1, dy = y2 - y1;
    const len2 = dx*dx + dy*dy || 1;
    const t = Math.max(0, Math.min(1, ((px-x1)*dx + (py-y1)*dy) / len2));
    return {x: x1 + t*dx, y: y1 + t*dy};
  }

  function closestPointOnBumper(px, py, rail){
    if(rail.arc) return closestPointOnArc(px, py, rail.arc);
    const a = rail.points[0], b = rail.points[rail.points.length-1];
    return closestPointOnSegment(px, py, a.x, a.y, b.x, b.y);
  }

  function addBumperRun(startCol, endCol){
    const edgeLeft = startCol === 0;
    const edgeRight = endCol === COLS-1;
    const leftX = startCol*CELL + (edgeLeft ? BUMPER_EDGE_PAD : 8);
    const rightX = (endCol+1)*CELL - (edgeRight ? BUMPER_EDGE_PAD : 8);
    const span = Math.max(24, rightX - leftX);
    const h = BUMPER_ARC;

    if(edgeLeft && edgeRight){
      const y = BUMPER_BASE_Y - h*0.35;
      bumperPaths.push({
        points: [{x:leftX,y},{x:rightX,y}],
        hit:0, edgeLeft, edgeRight
      });
      return;
    }

    if(edgeLeft){
      const R = (span*span + h*h) / (2*h);
      const cx = leftX;
      const cy = BUMPER_BASE_Y - h + R;
      const a0 = -Math.PI/2;
      const a1 = a0 + normalizeArcDelta(a0, Math.atan2(BUMPER_BASE_Y - cy, rightX - cx));
      bumperPaths.push({
        points: [
          {x: cx + Math.cos(a0)*R, y: cy + Math.sin(a0)*R},
          {x: cx + Math.cos(a1)*R, y: cy + Math.sin(a1)*R}
        ],
        hit:0, edgeLeft, edgeRight,
        arc: {cx, cy, r:R, a0, a1}
      });
      return;
    }

    if(edgeRight){
      const R = (span*span + h*h) / (2*h);
      const cx = rightX;
      const cy = BUMPER_BASE_Y - h + R;
      const leftA = Math.atan2(BUMPER_BASE_Y - cy, leftX - cx);
      const peakA = -Math.PI/2;
      const a0 = leftA;
      const a1 = leftA + normalizeArcDelta(leftA, peakA);
      bumperPaths.push({
        points: [
          {x: cx + Math.cos(a0)*R, y: cy + Math.sin(a0)*R},
          {x: cx + Math.cos(a1)*R, y: cy + Math.sin(a1)*R}
        ],
        hit:0, edgeLeft, edgeRight,
        arc: {cx, cy, r:R, a0, a1}
      });
      return;
    }

    const R = (h*h + (span*0.5)*(span*0.5)) / (2*h);
    const cx = (leftX + rightX) * 0.5;
    const cy = BUMPER_BASE_Y - h + R;
    const leftA = Math.atan2(BUMPER_BASE_Y - cy, leftX - cx);
    const rightA = Math.atan2(BUMPER_BASE_Y - cy, rightX - cx);
    const a0 = leftA;
    const a1 = leftA + normalizeArcDelta(leftA, rightA);
    bumperPaths.push({
      points: [
        {x: cx + Math.cos(a0)*R, y: cy + Math.sin(a0)*R},
        {x: cx + Math.cos(a1)*R, y: cy + Math.sin(a1)*R}
      ],
      hit:0, edgeLeft, edgeRight,
      arc: {cx, cy, r:R, a0, a1}
    });
  }

  function recomputeBumpers(){
    bumperPaths = [];
    let c = 0;
    while(c < COLS){
      if(colHeights[c] < ROWS){ c++; continue; }
      const start = c;
      while(c < COLS && colHeights[c] >= ROWS) c++;
      addBumperRun(start, c-1);
    }
  }

  function impartSpin(ball, nx, ny){
    // Tangential kick from the contact normal — cards tumble as they bonk.
    const tangent = -nx*ball.vy + ny*ball.vx;
    ball.spin += tangent * 0.045 + (Math.random()-0.5)*0.35;
    ball.spin = Math.max(-0.55, Math.min(0.55, ball.spin));
  }

  function collideBallWithBumpers(ball){
    for(const rail of bumperPaths){
      const closest = closestPointOnBumper(ball.x, ball.y, rail);
      const dx = ball.x - closest.x, dy = ball.y - closest.y;
      const dist = Math.hypot(dx, dy);
      const minDist = ball.radius + BUMPER_R;
      if(dist >= minDist || dist <= 0.0001) continue;
      const nx = dx/dist, ny = dy/dist;
      ball.x = closest.x + nx*minDist;
      ball.y = closest.y + ny*minDist;
      let kx = nx, ky = ny;
      if(rail.edgeLeft) kx = Math.max(kx, 0.4);
      if(rail.edgeRight) kx = Math.min(kx, -0.4);
      const kLen = Math.hypot(kx, ky) || 1;
      kx /= kLen; ky /= kLen;
      const dot = ball.vx*kx + ball.vy*ky;
      if(dot < 0){
        ball.vx -= 2*dot*kx;
        ball.vy -= 2*dot*ky;
      }
      ball.vx *= 1.05; ball.vy *= 1.05;
      ball.vx += kx*1.4 + (Math.random()*0.6-0.3);
      if(rail.edgeLeft) ball.vx = Math.max(ball.vx, 2.4);
      if(rail.edgeRight) ball.vx = Math.min(ball.vx, -2.4);
      ball.vy = Math.min(ball.vy, -1.5);
      impartSpin(ball, kx, ky);
      if(!rail.hit){
        const payout = bumperHitPayout();
        if(payout > 0){
          awardChips(payout);
          spawnHitPopup(ball.x, ball.y, '+' + payout, PEG);
        }
      }
      rail.hit = 14;
    }
  }

  // ---- column buttons ----
  const colsEl = document.getElementById('cols');
  colsEl.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
  const buttons = [];
  for(let c=0;c<COLS;c++){
    const b = document.createElement('button');
    b.className = 'colbtn';
    b.textContent = '▾';
    b.addEventListener('click', ()=>dropInColumn(c));
    colsEl.appendChild(b);
    buttons.push(b);
  }

  function inputBlocked(){
    return gameOver;
  }

  // ---- match resolution (clear + cascade) state ----
  let resolving = false;
  let resolvePhase = null;
  let resolvePhaseStart = 0;
  let resolveEpoch = 0;
  let currentGroups = [];
  let chainStep = 0;
  let pendingChain = 0;
  let flashCells = null;
  let particles = [];
  let popups = [];
  const FLASH_MS = 480, EXPLODE_MS = 280;

  function refreshButtons(){
    const blocked = inputBlocked();
    for(let c=0;c<COLS;c++){
      buttons[c].disabled = blocked;
      buttons[c].classList.toggle('full', colHeights[c] >= ROWS);
    }
  }

  // ---- balls / animation state ----
  let balls = [];
  let looping = false;
  let resolveLooping = false;
  let aimX = W/2;

  const BALL_RADIUS = 14;
  const HOLE_R = 29;
  const SAFETY_LIMIT = 420;

  function dropInColumn(col){
    if(inputBlocked()) return;
    dropAt(col*CELL + CELL/2, {autoCol: col});
  }

  function dropAt(x, opts){
    if(gameOver) return;
    if(colHeights.every(h=>h>=ROWS)) return;
    if(!nextCard) nextCard = dealCard();
    const card = nextCard;
    nextCard = dealCard();
    updateNextUI();
    const ball = {
      x: Math.max(BALL_RADIUS, Math.min(W-BALL_RADIUS, x)) + (Math.random()*6-3),
      y: 14,
      vx: (Math.random()*2-1),
      vy: 0.6,
      radius: BALL_RADIUS,
      phase: 'peg',
      targetCol: null,
      autoCol: opts && opts.autoCol != null ? opts.autoCol : null,
      row: null,
      card,
      angle: Math.random()*Math.PI*2,
      spin: (Math.random()-0.5)*0.25,
      frameSafety: 0,
      trail: [],
      freeDrop: resolving,
      dropEpoch: resolveEpoch
    };
    balls.push(ball);
    startLoop();
    refreshButtons();
  }

  function nearestOpenColumn(preferred){
    if(colHeights[preferred] < ROWS) return preferred;
    for(let d=1; d<COLS; d++){
      const l = preferred - d, r = preferred + d;
      if(l>=0 && colHeights[l] < ROWS) return l;
      if(r<COLS && colHeights[r] < ROWS) return r;
    }
    return preferred;
  }

  function startLoop(){
    if(!looping){
      looping = true;
      requestAnimationFrame(tick);
    }
  }

  function startResolveLoop(){
    if(!resolveLooping){
      resolveLooping = true;
      requestAnimationFrame(resolveTick);
    }
  }

  function stepBall(ball, gravity){
    ball.frameSafety++;
    ball.angle += ball.spin;
    ball.spin *= 0.992;

    if(ball.phase === 'peg'){
      ball.vy += gravity;
      ball.vy = Math.min(ball.vy, 15);
      ball.vx += (Math.random()-0.5)*0.18;
      ball.vx = Math.max(-7, Math.min(7, ball.vx));
      ball.x += ball.vx;
      ball.y += ball.vy;

      if(ball.x - ball.radius < 0){
        ball.x = ball.radius;
        ball.vx = Math.abs(ball.vx)*0.75 + 1.6;
        if(ball.y > BUMPER_BASE_Y - 90) ball.vx += 2.2;
        ball.spin -= 0.2;
      }
      if(ball.x + ball.radius > W){
        ball.x = W - ball.radius;
        ball.vx = -Math.abs(ball.vx)*0.75 - 1.6;
        if(ball.y > BUMPER_BASE_Y - 90) ball.vx -= 2.2;
        ball.spin += 0.2;
      }

      for(const p of pegs){
        const dx = ball.x - p.x, dy = ball.y - p.y;
        const dist = Math.hypot(dx,dy);
        const minDist = ball.radius + p.r;
        if(dist < minDist && dist > 0.0001){
          const nx = dx/dist, ny = dy/dist;
          ball.x = p.x + nx*minDist;
          ball.y = p.y + ny*minDist;
          const dot = ball.vx*nx + ball.vy*ny;
          ball.vx -= 2*dot*nx;
          ball.vy -= 2*dot*ny;
          ball.vx *= 0.88; ball.vy *= 0.88;
          ball.vx += (Math.random()*0.8-0.4);
          if(p.x < CELL*0.75) ball.vx = Math.max(ball.vx, 1.1);
          if(p.x > W - CELL*0.75) ball.vx = Math.min(ball.vx, -1.1);
          impartSpin(ball, nx, ny);
          if(!p.hit){
            const payout = pinHitPayout();
            if(payout > 0){
              awardChips(payout);
              spawnHitPopup(ball.x, ball.y, '+' + payout, trailRGBA(ball.card, 0.95));
            }
          }
          p.hit = 10;
        }
      }

      collideBallWithBumpers(ball);

      if(ball.y > PEG_ZONE - 20){
        collideBallWithSettledPieces(ball);
      }

      if(ball.frameSafety > SAFETY_LIMIT || (ball.y > PEG_ZONE && ball.vy >= 0)){
        enterGridColumn(ball);
      }
    } else {
      if(ball.y < PEG_ZONE - 8 && ball.vy < -0.5){
        releaseBallToPegs(ball);
      } else {
        stepGridBall(ball, gravity);
      }
    }

    ball.trail.push({x:ball.x, y:ball.y});
    if(ball.trail.length>10) ball.trail.shift();
  }

  function collideBallWithSettledPieces(ball){
    const PIECE_R = 32;
    for(let c=0;c<COLS;c++){
      const px = c*CELL + CELL/2;
      for(let i=0;i<stack[c].length;i++){
        const entry = stack[c][i];
        if(entry.type!=='piece') continue;
        const py = PEG_ZONE + (ROWS-1-i)*CELL + CELL/2;
        const dx = ball.x - px, dy = ball.y - py;
        const dist = Math.hypot(dx, dy);
        const minDist = ball.radius + PIECE_R - 4;
        if(dist < minDist && dist > 0.0001){
          const nx = dx/dist, ny = dy/dist;
          ball.x = px + nx*minDist;
          ball.y = py + ny*minDist;
          const dot = ball.vx*nx + ball.vy*ny;
          if(dot < 0){
            ball.vx -= 1.9*dot*nx;
            ball.vy -= 1.9*dot*ny;
          }
          ball.vx *= 0.9;
          ball.vy *= 0.9;
          impartSpin(ball, nx, ny);
        }
      }
    }
  }

  function rebuildColumnFromStack(c){
    const col = Array(ROWS).fill(0);
    for(let i=0;i<stack[c].length;i++){
      const entry = stack[c][i];
      const row = ROWS - 1 - i;
      if(entry.type==='ball'){
        entry.row = row;
        entry.ball.row = row;
      } else {
        col[row] = {suit: entry.card.suit, rank: entry.card.rank, angle: entry.angle||0};
      }
    }
    for(let r=0;r<ROWS;r++) grid[c][r] = col[r];
    colHeights[c] = stack[c].length;
  }

  const GRID_SETTLE_FRAMES = 360;

  function enterGridColumn(ball){
    ball.phase = 'grid';
    ball.y = Math.max(ball.y, PEG_ZONE + 1);
    const rawCol = Math.min(COLS-1, Math.max(0, Math.floor(ball.x / CELL)));
    const targetCol = nearestOpenColumn(rawCol);
    const h = stack[targetCol].length;
    if(h >= ROWS){
      ball.phase = 'peg';
      ball.y = PEG_ZONE - ball.radius;
      ball.vy = -Math.abs(ball.vy) - 2;
      return;
    }
    const row = ROWS - 1 - h;
    const entry = {type:'ball', ball, row};
    stack[targetCol].push(entry);
    colHeights[targetCol] = stack[targetCol].length;
    recomputeBumpers();
    ball.targetCol = targetCol;
    ball.row = row;
    ball.stackEntry = entry;
    ball.gridAge = 0;
    ball.vx *= 0.55;
  }

  function releaseBallToPegs(ball){
    const col = ball.targetCol;
    if(ball.stackEntry && col!=null){
      const idx = stack[col].indexOf(ball.stackEntry);
      if(idx>=0) stack[col].splice(idx, 1);
      rebuildColumnFromStack(col);
      recomputeBumpers();
    }
    ball.stackEntry = null;
    ball.targetCol = null;
    ball.row = null;
    ball.phase = 'peg';
    ball.frameSafety = 0;
    ball.gridAge = 0;
  }

  function seatBall(ball){
    const targetX = ball.targetCol*CELL + CELL/2;
    const landingY = PEG_ZONE + ball.row*CELL + CELL/2;
    ball.x = targetX;
    ball.y = landingY;
    ball.vx = 0;
    ball.vy = 0;
    ball.spin *= 0.2;
    ball.landed = true;
  }

  function stepGridBall(ball, gravity){
    ball.gridAge = (ball.gridAge || 0) + 1;
    const targetX = ball.targetCol*CELL + CELL/2;
    const colLeft = ball.targetCol*CELL + ball.radius + 4;
    const colRight = (ball.targetCol+1)*CELL - ball.radius - 4;
    const landingY = PEG_ZONE + ball.row*CELL + CELL/2;

    if(ball.gridAge > GRID_SETTLE_FRAMES){
      seatBall(ball);
      return;
    }

    ball.vy += gravity;
    ball.vy = Math.min(ball.vy, 20);
    ball.x += ball.vx;
    ball.y += ball.vy;

    if(ball.x < colLeft){ ball.x = colLeft; ball.vx = Math.abs(ball.vx)*0.35; ball.spin -= 0.08; }
    if(ball.x > colRight){ ball.x = colRight; ball.vx = -Math.abs(ball.vx)*0.35; ball.spin += 0.08; }

    const nearSeat = ball.y > landingY - CELL*0.7;
    ball.vx += (targetX - ball.x) * (nearSeat ? 0.12 : 0.04);
    ball.vx *= nearSeat ? 0.9 : 0.98;
    if(nearSeat) ball.spin *= 0.9;

    if(ball.y >= landingY){
      ball.y = landingY;
      if(ball.vy > 4){
        ball.vy = -ball.vy*0.22;
        ball.vx *= 0.55;
        ball.spin *= 0.6;
      } else {
        seatBall(ball);
      }
    }
  }

  function resolveBallCollisions(){
    for(let i=0;i<balls.length;i++){
      for(let j=i+1;j<balls.length;j++){
        const a = balls[i], b = balls[j];
        if(a.phase==='grid' && b.phase==='grid' && a.targetCol===b.targetCol) continue;
        const dx = b.x-a.x, dy = b.y-a.y;
        const dist = Math.hypot(dx,dy);
        const minDist = a.radius+b.radius;
        if(dist < minDist && dist > 0.0001){
          const nx = dx/dist, ny = dy/dist;
          const overlap = (minDist-dist)/2;
          a.x -= nx*overlap; a.y -= ny*overlap;
          b.x += nx*overlap; b.y += ny*overlap;
          const avn = a.vx*nx + a.vy*ny;
          const bvn = b.vx*nx + b.vy*ny;
          a.vx += (bvn-avn)*nx; a.vy += (bvn-avn)*ny;
          b.vx += (avn-bvn)*nx; b.vy += (avn-bvn)*ny;
          impartSpin(a, nx, ny);
          impartSpin(b, -nx, -ny);
        }
      }
    }
  }

  function forceSeatStuckGridBalls(){
    let any = false;
    for(const b of balls){
      if(b.phase==='grid' && !b.landed && (b.gridAge || 0) > GRID_SETTLE_FRAMES){
        seatBall(b);
        any = true;
      }
    }
    return any;
  }

  function tick(){
    const now = performance.now();
    tryAutoDrop(now);
    tryAutoSuitBomb(now);
    updateSuitBombUI(now);

    const speed = physicsSpeed();
    const gravity = 0.42 * Math.min(speed, 3.2);
    // Ease off multi-step when the peg zone is crowded.
    const busy = balls.length > 18 ? 1 : Math.max(1, Math.min(3, Math.round(speed)));
    const steps = busy;
    for(const p of pegs){ if(p.hit) p.hit--; }
    for(const path of bumperPaths){ if(path.hit) path.hit--; }

    for(let s=0;s<steps;s++){
      for(const ball of balls){
        stepBall(ball, gravity / steps);
      }
      resolveBallCollisions();
      forceSeatStuckGridBalls();
    }
    stepParticles();

    const landed = balls.filter(b=>b.landed);
    if(landed.length){
      balls = balls.filter(b=>!b.landed);
      for(const b of landed) finalizeDrop(b);
      if(!resolving) maybeStartResolve();
    }

    // Board packed solid with nothing left seating in-column: blow the floor
    // even while peg-zone pucks are still bouncing — they'll fall in after.
    if(!resolving && boardIsFull() && !hasGridBalls()) beginFloorClear();

    draw();

    const nowEnd = performance.now();
    const popupsAlive = popups.some(p => nowEnd - p.t0 < p.duration);
    const bombCharging = suitBombUnlocked() && !suitBombReady(nowEnd);
    const bombAuto = upgradeLevel('autoSuitBomb') > 0 && suitBombUnlocked();
    if(balls.length>0 || particles.length>0 || popupsAlive || resolving
      || Number.isFinite(autoDropIntervalMs()) || bombCharging || bombAuto){
      requestAnimationFrame(tick);
    } else {
      looping = false;
    }
  }

  function finalizeDrop(ball){
    const col = ball.targetCol, row = ball.row;
    const angle = ball.angle || 0;
    const card = {suit: ball.card.suit, rank: ball.card.rank, angle};
    grid[col][row] = card;
    if(ball.stackEntry){
      ball.stackEntry.type = 'piece';
      ball.stackEntry.card = {suit: card.suit, rank: card.rank};
      ball.stackEntry.angle = angle;
      delete ball.stackEntry.ball;
    }
    refreshButtons();
  }

  // ---- poker hand finding ----
  // Contiguous filled runs in → ↓ ↘ ↙. Inside each run, greedily pick the
  // best non-overlapping poker windows (size 5 → 3).
  function findPokerHands(){
    const dirs = [[1,0],[0,1],[1,1],[1,-1]];
    const groups = [];
    for(const [dx,dy] of dirs){
      for(let c=0;c<COLS;c++){
        for(let r=0;r<ROWS;r++){
          if(!grid[c][r]) continue;
          const pc = c-dx, pr = r-dy;
          if(pc>=0 && pc<COLS && pr>=0 && pr<ROWS && grid[pc][pr]) continue;

          const cells = [];
          const cards = [];
          let cc=c, cr=r;
          while(cc>=0 && cc<COLS && cr>=0 && cr<ROWS && grid[cc][cr]){
            cells.push([cc,cr]);
            cards.push(grid[cc][cr]);
            cc+=dx; cr+=dy;
          }
          if(cards.length < 3) continue;

          const candidates = [];
          for(let len=5; len>=3; len--){
            if(cards.length < len) continue;
            for(let i=0;i<=cards.length-len;i++){
              const hand = evaluateCards(cards.slice(i, i+len));
              if(!hand) continue;
              candidates.push({
                i, len,
                name: hand.name,
                points: hand.points,
                cells: cells.slice(i, i+len)
              });
            }
          }
          candidates.sort((a,b)=> b.points - a.points || b.len - a.len || a.i - b.i);
          const used = new Array(cards.length).fill(false);
          for(const cand of candidates){
            let free = true;
            for(let k=cand.i;k<cand.i+cand.len;k++) if(used[k]){ free=false; break; }
            if(!free) continue;
            for(let k=cand.i;k<cand.i+cand.len;k++) used[k]=true;
            groups.push({
              name: cand.name,
              points: cand.points,
              cells: cand.cells,
              color: SUIT_COLOR[cards[cand.i].suit]
            });
          }
        }
      }
    }
    return groups;
  }

  // Scan contiguous runs for patterns that are one card away from scoring.
  // Returns guide lines sorted strongest-first (flush draw > straight > pair).
  function findNearMisses(){
    const dirs = [[1,0],[0,1],[1,1],[1,-1]];
    const hints = [];
    const seen = new Set();

    function pushHint(cells, kind, label, color, priority){
      const key = kind + '|' + cells.map(([c,r])=>c+','+r).join(';');
      if(seen.has(key)) return;
      // Skip if every cell is already flashing in a real hand clear
      if(flashCells && cells.every(([c,r]) => flashCells.has(c+','+r))) return;
      seen.add(key);
      hints.push({cells, kind, label, color, priority});
    }

    for(const [dx,dy] of dirs){
      for(let c=0;c<COLS;c++){
        for(let r=0;r<ROWS;r++){
          if(!grid[c][r]) continue;
          const pc = c-dx, pr = r-dy;
          if(pc>=0 && pc<COLS && pr>=0 && pr<ROWS && grid[pc][pr]) continue;

          const cells = [];
          const cards = [];
          let cc=c, cr=r;
          while(cc>=0 && cc<COLS && cr>=0 && cr<ROWS && grid[cc][cr]){
            cells.push([cc,cr]);
            cards.push(grid[cc][cr]);
            cc+=dx; cr+=dy;
          }
          if(cards.length < 2) continue;

          const scoringMask = new Array(cards.length).fill(false);
          for(let len=5; len>=3; len--){
            if(cards.length < len) continue;
            for(let i=0;i<=cards.length-len;i++){
              if(!evaluateCards(cards.slice(i, i+len))) continue;
              for(let k=i;k<i+len;k++) scoringMask[k]=true;
            }
          }

          // Same-cell flush+straight draws collapse to one "SF" hint so
          // labels never stack on top of each other.
          const sfWindows = new Set();

          if(cards.length >= 4){
            for(let i=0;i<=cards.length-4;i++){
              const slice = cards.slice(i, i+4);
              const sliceCells = cells.slice(i, i+4);
              if(slice.some((_,k)=>scoringMask[i+k])) continue;
              const sameSuit = slice.every(card => card.suit === slice[0].suit);
              const straightish = canCompleteStraight(slice.map(card => card.rank));
              if(sameSuit && straightish){
                sfWindows.add('4:'+i);
                pushHint(sliceCells, 'sf4', 'SF', SUIT_COLOR[slice[0].suit], 50);
              } else if(sameSuit){
                pushHint(sliceCells, 'flush4', 'flush', SUIT_COLOR[slice[0].suit], 40);
              } else if(straightish){
                pushHint(sliceCells, 'straight4', 'straight', PEG, 35);
              }
            }
          }

          if(cards.length >= 3){
            for(let i=0;i<=cards.length-3;i++){
              const slice = cards.slice(i, i+3);
              const sliceCells = cells.slice(i, i+3);
              if(slice.some((_,k)=>scoringMask[i+k])) continue;
              // Covered by a 4-card SF window that includes this stub
              if(sfWindows.has('4:'+i) || sfWindows.has('4:'+(i-1))) continue;
              const sameSuit = slice.every(card => card.suit === slice[0].suit);
              const straightish = isConnectedStraight3(slice.map(card => card.rank));
              if(sameSuit && straightish){
                pushHint(sliceCells, 'sf3', 'SF', SUIT_COLOR[slice[0].suit], 28);
              } else if(sameSuit){
                pushHint(sliceCells, 'flush3', 'flush', SUIT_COLOR[slice[0].suit], 18);
              } else if(straightish){
                pushHint(sliceCells, 'straight3', 'straight', '#B8B0E0', 16);
              }
            }
          }

          // Adjacent pair → one away from trips
          for(let i=0;i<=cards.length-2;i++){
            if(scoringMask[i] || scoringMask[i+1]) continue;
            if(cards[i].rank === cards[i+1].rank){
              pushHint(
                cells.slice(i, i+2),
                'pair',
                'trips',
                SUIT_COLOR[cards[i].suit],
                22
              );
            }
          }
        }
      }
    }

    // Prefer stronger draws; drop stubs covered by a longer same-family hint.
    // SF also suppresses flush/straight on the same cells.
    function family(kind){
      if(kind.startsWith('sf')) return 'sf';
      if(kind.startsWith('flush')) return 'flush';
      if(kind.startsWith('straight')) return 'straight';
      return kind;
    }
    function coversFamily(keeper, other){
      const kf = family(keeper.kind), of = family(other.kind);
      if(kf === of) return true;
      if(kf === 'sf' && (of === 'flush' || of === 'straight')) return true;
      return false;
    }

    hints.sort((a,b)=> b.priority - a.priority);
    const kept = [];
    for(const h of hints){
      const keys = h.cells.map(([c,r])=>c+','+r);
      const covered = kept.some(k => {
        if(!coversFamily(k, h)) return false;
        const set = new Set(k.cells.map(([c,r])=>c+','+r));
        return keys.every(key => set.has(key));
      });
      if(covered) continue;
      kept.push(h);
      if(kept.length >= 12) break;
    }
    return kept;
  }

  function cellCenter(col, row){
    return {x: col*CELL + CELL/2, y: PEG_ZONE + row*CELL + CELL/2};
  }

  function drawNearMissHints(){
    if(gameOver || resolving) return;
    const hints = findNearMisses();
    if(!hints.length) return;

    for(const h of hints){
      const pts = h.cells.map(([c,r]) => cellCenter(c,r));
      const strong = h.priority >= 30;
      const alpha = strong ? 0.34 : 0.2;
      const width = strong ? 2.4 : 1.6;

      ctx.save();
      ctx.setLineDash(strong ? [6, 6] : [4, 7]);
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = h.color;
      ctx.globalAlpha = alpha;
      ctx.shadowColor = h.color;
      ctx.shadowBlur = strong ? 10 : 5;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();

      // Soft rings so the linked cards read even when the dash sits on plastic
      ctx.setLineDash([]);
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = alpha * 0.85;
      for(const p of pts){
        ctx.beginPath();
        ctx.arc(p.x, p.y, HOLE_R - 3, 0, Math.PI*2);
        ctx.stroke();
      }

      // Odd-length spans (3, 5, …) have their geometric midpoint on a puck —
      // park the label in a gap between two neighboring cells instead.
      const a = pts[0], b = pts[pts.length-1];
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      let mx, my;
      if(pts.length >= 3 && pts.length % 2 === 1){
        const m = (pts.length/2)|0;
        mx = (pts[m-1].x + pts[m].x) / 2;
        my = (pts[m-1].y + pts[m].y) / 2;
      } else {
        mx = (a.x + b.x) / 2;
        my = (a.y + b.y) / 2;
      }
      // Slight sideways nudge off the dash itself
      const ox = (-dy / len) * 8;
      const oy = (dx / len) * 8;
      ctx.globalAlpha = Math.min(0.75, alpha * 1.35);
      ctx.shadowBlur = 0;
      ctx.font = "600 11px 'IBM Plex Mono', monospace";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = h.color;
      ctx.fillText(h.label, mx + ox, my + oy);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.setLineDash([]);
  }

  function scoreGroups(groups, chainMultiplier){
    let pts = 0;
    for(const g of groups) pts += g.points;
    if(groups.length > 1) pts += (groups.length - 1);
    return pts * chainMultiplier;
  }

  function spawnPopups(groups, _totalPts, chainMult){
    const now = performance.now();
    const mult = scoreMultiplier();
    for(const g of groups){
      const avgC = g.cells.reduce((s,c)=>s+c[0],0)/g.cells.length;
      const avgR = g.cells.reduce((s,c)=>s+c[1],0)/g.cells.length;
      const x = avgC*CELL+CELL/2;
      const y = PEG_ZONE + avgR*CELL + CELL/2;
      const pts = Math.floor(g.points * chainMult * mult);
      pushPopup({
        x, y,
        text: g.name + ' +' + pts,
        color: g.color || '#ffffff',
        t0:now,
        duration:1100
      });
    }
    if(chainMult>1){
      pushPopup({
        x:W/2, y:PEG_ZONE*0.4,
        text:'CHAIN ×'+chainMult+'!',
        color:'#ffffff', t0:now, duration:1200, big:true
      });
    }
    if(groups.length>1){
      pushPopup({
        x:W/2, y:PEG_ZONE*0.4 + (chainMult>1?34:0),
        text:'COMBO ×'+groups.length,
        color: PEG, t0:now, duration:1200
      });
    }
  }

  function spawnExplosion(x, y, card){
    if(particles.length >= MAX_PARTICLES) return;
    const color = card ? SUIT_COLOR[card.suit] : '#ffffff';
    const budget = Math.max(0, MAX_PARTICLES - particles.length);
    const sparks = Math.min(12, budget);
    for(let i=0;i<sparks;i++){
      const ang = Math.random()*Math.PI*2;
      const spd = 2.2 + Math.random()*6.5;
      particles.push({
        x, y,
        vx: Math.cos(ang)*spd,
        vy: Math.sin(ang)*spd - 3.5,
        r: 2.5 + Math.random()*5,
        color,
        life: 1,
        decay: 0.018 + Math.random()*0.025
      });
    }
    const flares = Math.min(3, Math.max(0, MAX_PARTICLES - particles.length));
    for(let i=0;i<flares;i++){
      const ang = -Math.PI/2 + (Math.random()-0.5)*1.4;
      const spd = 5 + Math.random()*5;
      particles.push({
        x, y,
        vx: Math.cos(ang)*spd,
        vy: Math.sin(ang)*spd,
        r: 5 + Math.random()*4,
        color: '#ffffff',
        life: 1,
        decay: 0.03 + Math.random()*0.02
      });
    }
  }

  function stepParticles(){
    for(const p of particles){
      p.vy += 0.25;
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.99;
      p.life -= p.decay;
    }
    particles = particles.filter(p => p.life > 0);
  }

  function launchPuckFromCell(col, row, card, angle, stackPos, fromClearIndex){
    if(balls.length >= MAX_CASCADE_BALLS) return false;
    const x = col*CELL + CELL/2 + (Math.random()*10-5);
    const y = PEG_ZONE + row*CELL + CELL/2;
    const heightBoost = Math.max(0, stackPos - fromClearIndex);
    const depth = Math.max(0, row);
    const ball = {
      x, y,
      vx: (Math.random()-0.5)*8,
      vy: -(12 + Math.random()*5 + heightBoost*2.4 + depth*0.9),
      radius: BALL_RADIUS,
      phase: 'peg',
      targetCol: null,
      row: null,
      card: {suit: card.suit, rank: card.rank},
      angle: angle || 0,
      spin: (Math.random()-0.5)*0.5,
      frameSafety: 0,
      trail: [],
      stackEntry: null,
      cascadeBall: true
    };
    balls.push(ball);
    return true;
  }

  function applyExplosionClear(groups){
    const cleared = new Set();
    for(const g of groups) for(const [c,r] of g.cells) cleared.add(c+','+r);

    for(const key of cleared){
      const [c,r] = key.split(',').map(Number);
      const card = grid[c][r];
      if(card) spawnExplosion(c*CELL+CELL/2, PEG_ZONE+r*CELL+CELL/2, card);
    }

    for(let c=0;c<COLS;c++){
      const oldStack = stack[c];
      let lowestClearedIdx = Infinity;
      for(let i=0;i<oldStack.length;i++){
        const oldRow = ROWS - 1 - i;
        if(oldStack[i].type==='piece' && cleared.has(c+','+oldRow)){
          lowestClearedIdx = Math.min(lowestClearedIdx, i);
        }
      }

      const survivors = [];
      for(let i=0;i<oldStack.length;i++){
        const entry = oldStack[i];
        const oldRow = ROWS - 1 - i;
        if(entry.type==='piece' && cleared.has(c+','+oldRow)){
          continue;
        }
        if(lowestClearedIdx !== Infinity && i > lowestClearedIdx){
          if(entry.type==='piece'){
            // Cap cascade launches so floor clears can't flood the peg zone.
            if(launchPuckFromCell(c, oldRow, entry.card, entry.angle, i, lowestClearedIdx)){
              continue;
            }
            // Over cap: keep the piece and let column rebuild settle it down.
          } else if(entry.type==='ball'){
            const b = entry.ball;
            b.vx += (Math.random()-0.5)*6;
            b.vy = Math.min(b.vy, 0) - (8 + Math.random()*4 + (i-lowestClearedIdx)*1.5);
            b.spin += (Math.random()-0.5)*0.4;
            b.stackEntry = null;
            b.targetCol = null;
            b.row = null;
            b.phase = 'peg';
            b.frameSafety = 0;
            b.gridAge = 0;
            b.cascadeBall = true;
            b.freeDrop = false;
            continue;
          } else {
            continue;
          }
        }
        survivors.push(entry);
      }

      stack[c] = survivors;
      rebuildColumnFromStack(c);
    }
    recomputeBumpers();
    startLoop();
  }

  function boardIsFull(){
    return colHeights.every(h=>h>=ROWS);
  }

  function hasGridBalls(){
    return balls.some(b => b.phase==='grid');
  }

  // Board-full escape hatch: nuke the entire bottom row (no points). Pieces
  // above get flung back into the pegs — same blast as a hand clear.
  // Peg-zone pucks are left alone; once columns open they'll fall in.
  function beginFloorClear(){
    if(resolving || gameOver || !boardIsFull()) return;
    const row = ROWS - 1;
    const cells = [];
    for(let c=0;c<COLS;c++){
      if(grid[c][row]) cells.push([c, row]);
    }
    if(!cells.length) return;
    resolving = true;
    resolveEpoch++;
    pendingChain = 0;
    chainStep = 0;
    const first = grid[cells[0][0]][row];
    currentGroups = [{
      name: 'FLOOR CLEAR',
      points: 0,
      cells,
      floorClear:true,
      color: first ? SUIT_COLOR[first.suit] : '#ffffff'
    }];
    flashCells = new Set(cells.map(([c,r]) => c+','+r));
    resolvePhase = 'flash';
    resolvePhaseStart = performance.now();
    refreshButtons();
    startResolveLoop();
  }

  function findSuitCells(suit){
    const cells = [];
    for(let c=0;c<COLS;c++){
      for(let r=0;r<ROWS;r++){
        const card = grid[c][r];
        if(card && card.suit === suit) cells.push([c, r]);
      }
    }
    return cells;
  }

  function beginSuitBomb(suit, cells){
    resolving = true;
    resolveEpoch++;
    pendingChain = 0;
    chainStep = 0;
    currentGroups = [{
      name: 'SUIT PURGE ' + suit,
      points: Math.max(1, cells.length),
      cells,
      suitBomb: true,
      color: SUIT_COLOR[suit] || '#ffffff'
    }];
    flashCells = new Set(cells.map(([c,r]) => c+','+r));
    resolvePhase = 'flash';
    resolvePhaseStart = performance.now();
    refreshButtons();
    updateSuitBombUI(performance.now(), true);
    startResolveLoop();
  }

  function castSuitBomb(suit){
    const now = performance.now();
    if(!suitBombReady(now) || gameOver) return false;
    if(!SUITS.includes(suit)) return false;
    const cells = findSuitCells(suit);
    if(cells.length < 1) return false;
    // Spend the charge immediately so a mid-clear click still counts.
    suitBombReadyAt = now + suitBombCooldownMs();
    scheduleSave();
    if(resolving){
      pendingSuitBomb = suit;
      updateSuitBombUI(performance.now(), true);
      return true;
    }
    beginSuitBomb(suit, cells);
    return true;
  }

  function flushPendingSuitBomb(){
    if(!pendingSuitBomb || resolving || gameOver) return;
    const suit = pendingSuitBomb;
    pendingSuitBomb = null;
    const cells = findSuitCells(suit);
    if(cells.length < 1){
      updateSuitBombUI(performance.now(), true);
      return;
    }
    beginSuitBomb(suit, cells);
  }

  function pickAutoSuitBombTarget(){
    let best = null, bestCount = 0;
    for(const s of SUITS){
      const n = findSuitCells(s).length;
      if(n > bestCount){
        bestCount = n;
        best = s;
      }
    }
    // Don't waste a charge on a lonely singleton.
    if(bestCount < 2) return null;
    return best;
  }

  function tryAutoSuitBomb(now){
    if(!upgradeLevel('autoSuitBomb') || !suitBombReady(now)) return;
    if(resolving || gameOver) return;
    const suit = pickAutoSuitBombTarget();
    if(!suit) return;
    castSuitBomb(suit);
  }

  function maybeStartResolve(){
    if(gameOver || resolving) return;
    const groups = findPokerHands();
    if(groups.length>0){
      beginResolveChain(groups);
    } else if(boardIsFull()){
      // Blow the floor once in-column pucks have seated. Peg-zone pucks can
      // keep bouncing — the clear opens columns for them to fall into.
      if(!hasGridBalls()){
        pendingChain = 0;
        beginFloorClear();
      } else {
        refreshButtons();
      }
    } else {
      if(balls.length===0) pendingChain = 0;
      refreshButtons();
    }
  }

  function beginResolveChain(groups){
    resolving = true;
    resolveEpoch++;
    chainStep = pendingChain;
    pendingChain = 0;
    refreshButtons();
    enterFlash(groups);
    startResolveLoop();
  }

  function enterFlash(groups){
    chainStep++;
    currentGroups = groups;
    flashCells = new Set();
    for(const g of groups) for(const [c,r] of g.cells) flashCells.add(c+','+r);
    resolvePhase = 'flash';
    resolvePhaseStart = performance.now();
  }

  function finishResolveOrChain(){
    const nextGroups = findPokerHands();
    if(nextGroups.length>0){
      enterFlash(nextGroups);
    } else {
      pendingChain = balls.length > 0 ? chainStep : 0;
      resolving = false;
      chainStep = 0;
      if(boardIsFull() && !hasGridBalls()){
        pendingChain = 0;
        beginFloorClear();
      } else {
        refreshButtons();
        flushPendingSuitBomb();
        if(!resolving) updateSuitBombUI(performance.now(), true);
      }
    }
  }

  function resolveTick(){
    const now = performance.now();
    const speed = Math.min(physicsSpeed(), 2.8);
    const flashMs = FLASH_MS / speed;
    const explodeMs = EXPLODE_MS / speed;
    if(resolving){
      const elapsed = now - resolvePhaseStart;
      if(resolvePhase==='flash'){
        if(elapsed >= flashMs){
          const isFloorClear = currentGroups.some(g => g.floorClear);
          if(!isFloorClear){
            const chainMult = Math.max(1, chainStep + chainBonus());
            const pts = Math.floor(scoreGroups(currentGroups, chainMult) * scoreMultiplier());
            awardChips(pts);
            clearTimeout(shopUiTimer);
            flushScoreUI();
            updateShopUI();
            spawnPopups(currentGroups, pts, chainMult);
          } else {
            const floorPts = floorClearPayout();
            if(floorPts > 0) awardChips(floorPts);
            clearTimeout(shopUiTimer);
            flushScoreUI();
            updateShopUI();
            pushPopup({
              x: W/2,
              y: PEG_ZONE + (ROWS-1)*CELL + CELL/2,
              text: floorPts > 0 ? ('FLOOR CLEAR +' + floorPts) : 'FLOOR CLEAR!',
              color: floorPts > 0 ? (getCSS('--felt-bright') || '#2d8a6e') : '#ffffff',
              t0: performance.now(),
              duration: 900,
              big: true
            });
          }
          applyExplosionClear(currentGroups);
          flashCells = null;
          resolvePhase = 'explode';
          resolvePhaseStart = now;
        }
      } else if(resolvePhase==='explode'){
        if(elapsed >= explodeMs){
          for(const b of balls) b.cascadeBall = false;
          finishResolveOrChain();
        }
      }
    }
    // Physics tick already paints when it's running — avoid double draws.
    if(!looping) draw();
    if(resolving){
      requestAnimationFrame(resolveTick);
    } else {
      resolveLooping = false;
      startLoop();
    }
  }

  // ---- drawing ----
  function drawCardFace(target, cx, cy, card, angle, radius, isBall, highlight){
    const color = SUIT_COLOR[card.suit];
    const ink = SUIT_INK[card.suit];
    target.save();
    target.translate(cx, cy);
    target.rotate(angle || 0);

    target.beginPath();
    target.arc(0, 0, radius, 0, Math.PI*2);
    const grad = target.createRadialGradient(-radius*0.35, -radius*0.4, radius*0.1, 0, 0, radius);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.55, '#f3efe6');
    grad.addColorStop(1, color);
    target.fillStyle = grad;
    if(isBall){ target.shadowColor = color; target.shadowBlur = 14; }
    target.fill();
    target.shadowBlur = 0;
    target.lineWidth = Math.max(2, radius*0.1);
    target.strokeStyle = ink;
    target.stroke();

    // inner chip ring
    target.beginPath();
    target.arc(0, 0, radius*0.78, 0, Math.PI*2);
    target.strokeStyle = `rgba(0,0,0,0.12)`;
    target.lineWidth = 1.5;
    target.stroke();

    target.fillStyle = ink;
    target.textAlign = 'center';
    target.textBaseline = 'middle';
    const label = rankLabel(card.rank);
    target.font = `bold ${Math.round(radius*0.72)}px 'Space Grotesk', sans-serif`;
    target.fillText(label, 0, -radius*0.18);
    target.font = `${Math.round(radius*0.7)}px 'Space Grotesk', sans-serif`;
    target.fillStyle = color;
    target.fillText(card.suit, 0, radius*0.32);

    if(highlight){
      target.beginPath();
      target.arc(0,0,radius+2,0,Math.PI*2);
      target.strokeStyle = `rgba(255,255,255,${0.25 + 0.55*highlight})`;
      target.lineWidth = 3;
      target.stroke();
    }
    target.restore();
  }

  function drawPiece(cx, cy, card, isBall, highlight){
    drawCardFace(ctx, cx, cy, card, card.angle||0, 32, isBall, highlight);
  }

  function drawFlashPiece(cx, cy, card, elapsedFrac){
    const color = SUIT_COLOR[card.suit];
    const pulse = 1 + 0.18*Math.sin(elapsedFrac*Math.PI*7);
    ctx.beginPath();
    ctx.arc(cx,cy,32*pulse,0,Math.PI*2);
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = color;
    ctx.shadowBlur = 30;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.lineWidth = 3;
    ctx.strokeStyle = color;
    ctx.stroke();
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(card.angle||0);
    ctx.fillStyle = SUIT_INK[card.suit];
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = "bold 18px 'Space Grotesk', sans-serif";
    ctx.fillText(rankLabel(card.rank), 0, -6);
    ctx.fillStyle = color;
    ctx.font = "18px 'Space Grotesk', sans-serif";
    ctx.fillText(card.suit, 0, 10);
    ctx.restore();
  }

  function drawBall(b){
    drawCardFace(ctx, b.x, b.y, b.card, b.angle||0, 32, true, 0);
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    const grad = ctx.createLinearGradient(0,0,0,PEG_ZONE);
    grad.addColorStop(0, '#1a1630');
    grad.addColorStop(1, PANEL2);
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,PEG_ZONE);

    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    for(let c=1;c<COLS;c++){
      ctx.beginPath();
      ctx.moveTo(c*CELL,0);
      ctx.lineTo(c*CELL,PEG_ZONE);
      ctx.stroke();
    }

    for(const p of pegs){
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = p.hit ? '#ffffff' : PEG;
      ctx.shadowColor = PEG;
      ctx.shadowBlur = p.hit ? 18 : 6;
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    const BUMPER_COLOR = '#FF6B4D';
    function strokeBumperPath(path){
      ctx.beginPath();
      if(path.arc){
        const {cx, cy, r, a0, a1} = path.arc;
        ctx.arc(cx, cy, r, a0, a1, a1 < a0);
      } else {
        const pts = path.points;
        if(pts.length < 2) return;
        ctx.moveTo(pts[0].x, pts[0].y);
        for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
      }
    }
    for(const path of bumperPaths){
      if(!path.points.length) continue;
      const hit = path.hit > 0;
      strokeBumperPath(path);
      ctx.strokeStyle = hit ? '#ffffff' : BUMPER_COLOR;
      ctx.lineWidth = BUMPER_R * 2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.shadowColor = BUMPER_COLOR;
      ctx.shadowBlur = hit ? 28 : 12;
      ctx.stroke();
      strokeBumperPath(path);
      ctx.strokeStyle = hit ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.35)';
      ctx.lineWidth = BUMPER_R * 0.7;
      ctx.shadowBlur = 0;
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.lineCap = 'butt';
    ctx.lineJoin = 'miter';

    for(const b of balls){
      if(b.phase==='grid' || b.y >= PEG_ZONE) continue;
      for(let i=0;i<b.trail.length;i++){
        const t = b.trail[i];
        const alpha = (i+1)/b.trail.length * 0.25;
        ctx.beginPath();
        ctx.arc(t.x,t.y,20,0,Math.PI*2);
        ctx.fillStyle = trailRGBA(b.card, alpha);
        ctx.fill();
      }
    }

    for(const b of balls){
      if(b.phase!=='grid' && b.y < PEG_ZONE) drawBall(b);
    }

    ctx.fillStyle = BG;
    ctx.fillRect(0,PEG_ZONE,W,H-PEG_ZONE);

    const flashElapsed = resolvePhase==='flash' ? Math.min(1,(performance.now()-resolvePhaseStart)/FLASH_MS) : 0;
    for(let c=0;c<COLS;c++){
      for(let r=0;r<ROWS;r++){
        const val = grid[c][r];
        if(!val) continue;
        const cx = c*CELL+CELL/2, cy = PEG_ZONE + r*CELL + CELL/2;
        const key = c+','+r;
        if(flashCells && flashCells.has(key)){
          drawFlashPiece(cx,cy,val,flashElapsed);
        } else {
          drawPiece(cx,cy,val, false);
        }
      }
    }

    for(const b of balls){
      if(b.phase==='grid') drawBall(b);
    }

    plateCtx.clearRect(0,PEG_ZONE,W,H-PEG_ZONE);
    plateCtx.fillStyle = PANEL;
    plateCtx.fillRect(0,PEG_ZONE,W,H-PEG_ZONE);
    plateCtx.globalCompositeOperation = 'destination-out';
    for(let c=0;c<COLS;c++){
      for(let r=0;r<ROWS;r++){
        const cx = c*CELL+CELL/2, cy = PEG_ZONE + r*CELL + CELL/2;
        plateCtx.beginPath();
        plateCtx.arc(cx,cy,HOLE_R,0,Math.PI*2);
        plateCtx.fill();
      }
    }
    plateCtx.globalCompositeOperation = 'source-over';

    for(let c=0;c<COLS;c++){
      for(let r=0;r<ROWS;r++){
        const cx = c*CELL+CELL/2, cy = PEG_ZONE + r*CELL + CELL/2;
        plateCtx.beginPath();
        plateCtx.arc(cx,cy,HOLE_R,0,Math.PI*2);
        plateCtx.lineWidth = 4;
        plateCtx.strokeStyle = 'rgba(0,0,0,0.55)';
        plateCtx.stroke();
        plateCtx.beginPath();
        plateCtx.arc(cx,cy,HOLE_R-2.5,0,Math.PI*2);
        plateCtx.lineWidth = 1.5;
        plateCtx.strokeStyle = 'rgba(255,255,255,0.07)';
        plateCtx.stroke();
      }
    }

    ctx.drawImage(plateCanvas, 0, 0);

    // Near-miss guides sit on top of the plate so the dotted bridges stay
    // readable between holes (pairs, flush/straight draws).
    drawNearMissHints();

    for(const b of balls){
      if(b.phase==='grid' || b.y < PEG_ZONE) continue;
      for(let i=0;i<b.trail.length;i++){
        const t = b.trail[i];
        if(t.y < PEG_ZONE) continue;
        const alpha = (i+1)/b.trail.length * 0.25;
        ctx.beginPath();
        ctx.arc(t.x,t.y,20,0,Math.PI*2);
        ctx.fillStyle = trailRGBA(b.card, alpha);
        ctx.fill();
      }
      drawBall(b);
    }

    for(const p of particles){
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;

    const nowP = performance.now();
    popups = popups.filter(p => nowP - p.t0 < p.duration);
    for(const p of popups){
      const t = (nowP - p.t0) / p.duration;
      const alpha = t < 0.7 ? 1 : Math.max(0, 1-(t-0.7)/0.3);
      const dy = -30*t;
      ctx.globalAlpha = alpha;
      ctx.font = (p.big ? 'bold 26px' : 'bold 16px') + " 'Space Grotesk', sans-serif";
      ctx.textAlign = 'center';
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.fillText(p.text, p.x, p.y+dy);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    if(!gameOver && nextCard){
      const c = SUIT_COLOR[nextCard.suit];
      ctx.beginPath();
      ctx.moveTo(aimX-9, 6);
      ctx.lineTo(aimX+9, 6);
      ctx.lineTo(aimX, 20);
      ctx.closePath();
      ctx.fillStyle = c;
      ctx.shadowColor = c;
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.shadowBlur = 0;
      // tiny spinning preview of the next card at the drop point
      drawCardFace(ctx, aimX, 38, nextCard, performance.now()/400, 12, false, 0);
    }
  }

  // ---- UI wiring ----
  const scoreValEl = document.getElementById('scoreVal');
  const lifetimeValEl = document.getElementById('lifetimeVal');
  const autoStatusEl = document.getElementById('autoStatus');
  const autoStatusValEl = document.getElementById('autoStatusVal');
  const upgradesEl = document.getElementById('upgrades');
  const nextLabel = document.getElementById('nextLabel');
  const banner = document.getElementById('banner');
  const bannerText = document.getElementById('bannerText');
  const upgradeButtons = {};

  function updateScoreUI(){
    scoreValEl.textContent = formatNum(score);
    if(lifetimeValEl) lifetimeValEl.textContent = formatNum(lifetime);
  }

  function updateAutoStatus(){
    const interval = autoDropIntervalMs();
    const on = Number.isFinite(interval);
    autoStatusEl.classList.toggle('on', on);
    if(!on){
      autoStatusValEl.textContent = 'off';
      return;
    }
    const n = autoDropCount();
    autoStatusValEl.textContent = formatInterval(interval) + (n > 1 ? ' ×' + n : '');
    startLoop();
  }

  function updateShopUI(){
    const active = [];
    const maxedList = [];
    for(const def of UPGRADE_DEFS){
      const btn = upgradeButtons[def.id];
      if(!btn) continue;
      const lvl = upgradeLevel(def.id);
      const maxed = lvl >= def.maxLevel;
      const locked = def.id === 'autoSuitBomb' && !suitBombUnlocked();
      const cost = upgradeCost(def);
      const canAfford = !maxed && !locked && score >= cost;
      btn.disabled = maxed || locked || !canAfford;
      btn.classList.toggle('affordable', canAfford);
      btn.classList.toggle('maxed', maxed);
      btn.querySelector('.upgrade-lvl').textContent = maxed
        ? 'MAX'
        : ('Lv ' + lvl + '/' + def.maxLevel);
      btn.querySelector('.upgrade-effect').textContent = upgradeEffectText(def);
      const costEl = btn.querySelector('.upgrade-cost');
      if(maxed){
        costEl.textContent = 'Maxed';
        costEl.className = 'upgrade-cost max';
      } else if(locked){
        costEl.textContent = 'Needs Suit Purge';
        costEl.className = 'upgrade-cost max';
      } else {
        costEl.textContent = formatNum(cost) + ' chips';
        costEl.className = 'upgrade-cost' + (canAfford ? '' : ' too-much');
      }
      (maxed ? maxedList : active).push(btn);
    }
    // Keep buyable upgrades up top; sink completed ones.
    for(const btn of active.concat(maxedList)) upgradesEl.appendChild(btn);
  }

  function buildShop(){
    upgradesEl.innerHTML = '';
    for(const def of UPGRADE_DEFS){
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'upgrade';
      btn.dataset.id = def.id;
      btn.innerHTML =
        '<div class="upgrade-top">' +
          '<span class="upgrade-name"></span>' +
          '<span class="upgrade-lvl"></span>' +
        '</div>' +
        '<p class="upgrade-desc"></p>' +
        '<div class="upgrade-effect"></div>' +
        '<div class="upgrade-cost"></div>';
      btn.querySelector('.upgrade-name').textContent = def.name;
      btn.querySelector('.upgrade-desc').textContent = def.desc;
      btn.addEventListener('click', ()=>buyUpgrade(def.id));
      upgradesEl.appendChild(btn);
      upgradeButtons[def.id] = btn;
    }
    updateShopUI();
  }

  const suitBombBar = document.getElementById('suitBombBar');
  const suitBombStatus = document.getElementById('suitBombStatus');
  const suitBombBtnsEl = document.getElementById('suitBombBtns');
  const suitBombButtons = {};

  function buildSuitBombUI(){
    suitBombBtnsEl.innerHTML = '';
    for(const s of SUITS){
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'suit-btn';
      btn.dataset.suit = s;
      btn.setAttribute('aria-label', 'Purge ' + s);
      btn.innerHTML = '<span class="cd-fill"></span><span class="suit-glyph"></span>';
      btn.querySelector('.suit-glyph').textContent = s;
      btn.addEventListener('click', ()=>castSuitBomb(s));
      suitBombBtnsEl.appendChild(btn);
      suitBombButtons[s] = btn;
    }
  }

  let lastSuitBombUiAt = 0;
  function updateSuitBombUI(now, force){
    if(!suitBombBar) return;
    now = now || performance.now();
    // Hot path: tick/idle used to thrash the DOM every frame.
    if(!force && now - lastSuitBombUiAt < 120) return;
    lastSuitBombUiAt = now;
    const unlocked = suitBombUnlocked();
    suitBombBar.classList.toggle('show', unlocked);
    if(!unlocked) return;

    const cd = suitBombCooldownMs();
    const ready = suitBombReady(now);
    const auto = upgradeLevel('autoSuitBomb') > 0;
    if(ready){
      suitBombStatus.textContent = auto ? 'ready · auto' : 'ready';
      suitBombStatus.className = auto ? 'ready auto' : 'ready';
    } else {
      const left = Math.max(0, suitBombReadyAt - now);
      suitBombStatus.textContent = formatInterval(left) + (auto ? ' · auto' : '');
      suitBombStatus.className = auto ? 'auto' : '';
    }

    const charge = ready ? 1 : Math.max(0, Math.min(1, 1 - (suitBombReadyAt - now) / cd));
    // One board scan for all suits instead of four.
    const counts = {'♠':0,'♥':0,'♦':0,'♣':0};
    for(let c=0;c<COLS;c++){
      for(let r=0;r<ROWS;r++){
        const card = grid[c][r];
        if(card) counts[card.suit] = (counts[card.suit]||0) + 1;
      }
    }
    for(const s of SUITS){
      const btn = suitBombButtons[s];
      if(!btn) continue;
      const count = counts[s] || 0;
      const queued = pendingSuitBomb === s;
      // Stay clickable during hand clears — cast queues until the board is free.
      const canCast = ready && !gameOver && count > 0;
      btn.disabled = !canCast && !queued;
      btn.classList.toggle('charging', !ready && !queued);
      btn.classList.toggle('queued', queued);
      btn.style.setProperty('--cd', Math.round((queued ? 1 : charge) * 100) + '%');
      btn.title = queued
        ? ('Queued purge ' + s)
        : count
          ? ('Purge ' + count + ' × ' + s)
          : ('No ' + s + ' on board');
    }
  }

  function updateNextUI(){
    if(!nextCard){
      nextLabel.textContent = '—';
      nextCtx.clearRect(0,0,nextPreview.width, nextPreview.height);
      return;
    }
    nextLabel.textContent = cardFace(nextCard);
    nextCtx.clearRect(0,0,nextPreview.width, nextPreview.height);
    drawCardFace(nextCtx, 36, 36, nextCard, 0, 30, false, 0);
  }

  document.getElementById('playAgain').addEventListener('click', ()=>{
    banner.classList.remove('show');
    freshState();
    refreshButtons();
    draw();
  });
  document.getElementById('resetScores').addEventListener('click', ()=>{
    if(!confirm('Reset chips, upgrades, and the board?')) return;
    resetProgress();
    freshState();
    refreshButtons();
    draw();
  });

  function canvasPos(evt){
    const rect = canvas.getBoundingClientRect();
    const src = evt.touches ? evt.touches[0] : evt;
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    return {
      x: (src.clientX - rect.left) * scaleX,
      y: (src.clientY - rect.top) * scaleY
    };
  }
  function canvasX(evt){ return canvasPos(evt).x; }

  canvas.addEventListener('mousemove', (e)=>{
    if(inputBlocked() || pointerDown) return;
    aimX = Math.max(BALL_RADIUS, Math.min(W-BALL_RADIUS, canvasX(e)));
    canvas.style.cursor = 'pointer';
    draw();
  });

  let pointerDown = false;
  canvas.addEventListener('pointerdown', (e)=>{
    if(inputBlocked()) return;
    pointerDown = true;
    canvas.setPointerCapture(e.pointerId);
    aimX = Math.max(BALL_RADIUS, Math.min(W-BALL_RADIUS, canvasX(e)));
    draw();
  });
  canvas.addEventListener('pointermove', (e)=>{
    if(!pointerDown) return;
    e.preventDefault();
    aimX = Math.max(BALL_RADIUS, Math.min(W-BALL_RADIUS, canvasX(e)));
    draw();
  });
  function releasePointer(){
    if(!pointerDown) return;
    pointerDown = false;
    if(!inputBlocked()) dropAt(aimX);
  }
  canvas.addEventListener('pointerup', releasePointer);
  canvas.addEventListener('pointercancel', ()=>{
    pointerDown = false;
  });
  canvas.style.cursor = 'pointer';
  canvas.style.touchAction = 'none';

  // Lightweight keeper: only runs work when the physics/resolve loops are idle.
  function idleSpin(){
    const now = performance.now();
    if(!looping && !resolveLooping){
      updateSuitBombUI(now);
      tryAutoDrop(now);
      tryAutoSuitBomb(now);
      const needLoop = balls.length || particles.length || resolving
        || Number.isFinite(autoDropIntervalMs())
        || (suitBombUnlocked() && (
          upgradeLevel('autoSuitBomb') > 0 || !suitBombReady(now)
        ));
      if(needLoop) startLoop();
      else draw();
    }
    requestAnimationFrame(idleSpin);
  }

  loadSave();
  buildShop();
  buildSuitBombUI();
  freshState();
  updateScoreUI();
  updateAutoStatus();
  updateShopUI();
  updateSuitBombUI();
  refreshButtons();
  draw();
  requestAnimationFrame(idleSpin);
  window.addEventListener('beforeunload', persistSave);
})();
</script>
</body>
</html>
