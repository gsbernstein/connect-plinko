<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VIP perk editor</title>
  <style>
    :root {
      --felt: #0f3d2e;
      --felt-deep: #08261c;
      --panel: rgba(0, 0, 0, 0.28);
      --border: rgba(240, 215, 140, 0.18);
      --gold: #f0d78c;
      --ivory: #f7f1e3;
      --muted: rgba(247, 241, 227, 0.62);
      --up: #7dd3a8;
      --down: #f0a07a;
      --accent: #5eb8ff;
      --danger: #ff8f7a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--ivory);
      background:
        radial-gradient(ellipse 120% 80% at 50% -10%, #1a5c45 0%, transparent 55%),
        linear-gradient(180deg, var(--felt-deep), var(--felt));
    }
    .wrap {
      max-width: 1440px;
      margin: 0 auto;
      padding: 24px 18px 40px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 18px;
      align-items: end;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0;
      font-size: 1.45rem;
      color: var(--gold);
    }
    .sub {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      max-width: 58ch;
      line-height: 1.45;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    button, .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.25);
      color: var(--ivory);
      border-radius: 10px;
      padding: 8px 12px;
      font: inherit;
      font-size: 0.86rem;
      cursor: pointer;
    }
    button:hover, .btn:hover { border-color: rgba(240, 215, 140, 0.45); }
    button.primary {
      background: rgba(240, 215, 140, 0.14);
      border-color: rgba(240, 215, 140, 0.45);
      color: var(--gold);
      font-weight: 700;
    }
    button.danger { border-color: rgba(255, 143, 122, 0.45); color: #ffc8bb; }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(280px, 0.85fr);
      gap: 16px;
      align-items: start;
    }
    @media (max-width: 1080px) {
      .layout { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
      overflow: hidden;
    }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--gold);
      font-size: 0.9rem;
      font-weight: 700;
    }
    .list {
      padding: 10px;
      min-height: 200px;
    }
    .drop-indicator {
      height: 3px;
      margin: 2px 8px;
      border-radius: 999px;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.12s;
    }
    .drop-indicator.show { opacity: 1; }
    .row {
      display: grid;
      grid-template-columns: 28px minmax(140px, 1.3fr) repeat(3, 84px) minmax(88px, 1fr) 52px;
      gap: 8px;
      align-items: center;
      padding: 10px 10px 8px;
      margin-bottom: 8px;
      border: 1px solid rgba(240, 215, 140, 0.12);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.18);
      transition: border-color 0.12s, transform 0.12s, opacity 0.12s;
    }
    .row.dragging {
      opacity: 0.45;
      transform: scale(0.985);
    }
    .row.drag-over {
      border-color: rgba(94, 184, 255, 0.65);
      box-shadow: 0 0 0 1px rgba(94, 184, 255, 0.25) inset;
    }
    @media (max-width: 900px) {
      .row {
        grid-template-columns: 28px 1fr 1fr;
        grid-template-areas:
          "handle title title"
          "handle base scale"
          "handle max preview"
          "handle toggle toggle";
      }
      .row .handle { grid-area: handle; }
      .row .title-wrap { grid-area: title; }
      .row .field-base { grid-area: base; }
      .row .field-scale { grid-area: scale; }
      .row .field-max { grid-area: max; }
      .row .preview { grid-area: preview; }
      .row .toggle-wrap { grid-area: toggle; }
    }
    .handle {
      display: grid;
      place-items: center;
      color: rgba(247, 241, 227, 0.45);
      cursor: grab;
      user-select: none;
      font-size: 1rem;
      line-height: 1;
    }
    .handle:active { cursor: grabbing; }
    .title-wrap { min-width: 0; }
    .rank {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 2px;
      font-weight: 700;
    }
    .name {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ivory);
      font: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      padding: 2px 4px;
      border-radius: 6px;
    }
    .name:focus, .num:focus, .desc:focus, textarea.export:focus {
      outline: none;
      border-color: rgba(94, 184, 255, 0.55);
      background: rgba(0, 0, 0, 0.22);
    }
    .id {
      font-size: 0.72rem;
      color: rgba(247, 241, 227, 0.42);
      margin-top: 2px;
      padding-left: 4px;
    }
    label {
      display: block;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .num {
      width: 100%;
      border: 1px solid rgba(240, 215, 140, 0.12);
      background: rgba(0, 0, 0, 0.18);
      color: var(--gold);
      border-radius: 8px;
      padding: 6px 8px;
      font: inherit;
      font-size: 0.86rem;
    }
    .preview {
      font-size: 0.72rem;
      line-height: 1.35;
      color: var(--muted);
    }
    .preview b { color: var(--ivory); }
    .toggle-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .toggle-wrap input { accent-color: var(--gold); }
    .desc-wrap {
      grid-column: 1 / -1;
      margin-top: 2px;
    }
    .desc {
      width: 100%;
      min-height: 52px;
      resize: vertical;
      border: 1px solid rgba(240, 215, 140, 0.1);
      background: rgba(0, 0, 0, 0.14);
      color: rgba(247, 241, 227, 0.82);
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
      font-size: 0.8rem;
      line-height: 1.4;
    }
    .row.open .desc-wrap { display: block; }
    .row .desc-wrap { display: none; }
    .expand {
      border: none;
      background: rgba(0, 0, 0, 0.18);
      color: var(--muted);
      padding: 6px 8px;
      font-size: 0.8rem;
      border-radius: 8px;
      justify-self: end;
    }
    .row.open .expand { color: var(--gold); }
    .side { display: grid; gap: 16px; }
    .flow-wrap { padding: 8px 10px 12px; }
    svg.flow {
      width: 100%;
      height: auto;
      display: block;
    }
    .export-tabs {
      display: flex;
      gap: 6px;
      padding: 10px 10px 0;
    }
    .export-tabs button.active {
      background: rgba(240, 215, 140, 0.14);
      border-color: rgba(240, 215, 140, 0.45);
      color: var(--gold);
    }
    textarea.export {
      width: 100%;
      min-height: 280px;
      border: none;
      border-top: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.22);
      color: #d9f0ff;
      padding: 12px 14px;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      resize: vertical;
    }
    .export-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 12px 12px;
      border-top: 1px solid var(--border);
    }
    .status {
      padding: 0 12px 12px;
      font-size: 0.78rem;
      color: var(--muted);
      min-height: 1.2em;
    }
    .status.ok { color: var(--up); }
    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      background: rgba(8, 38, 28, 0.95);
      border: 1px solid var(--border);
      color: var(--gold);
      padding: 10px 14px;
      border-radius: 10px;
      opacity: 0;
      transform: translateY(8px);
      transition: 0.18s;
      pointer-events: none;
      z-index: 20;
    }
    .toast.show { opacity: 1; transform: none; }
    .import-file { display: none; }
    .list-tail {
      height: 28px;
      margin: 0 8px 4px;
      border: 1px dashed rgba(240, 215, 140, 0.14);
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: rgba(247, 241, 227, 0.35);
      font-size: 0.75rem;
      transition: border-color 0.12s, background 0.12s;
    }
    .list-tail.drag-over {
      border-color: rgba(94, 184, 255, 0.65);
      background: rgba(94, 184, 255, 0.08);
      color: rgba(247, 241, 227, 0.72);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>VIP perk editor</h1>
        <p class="sub">Loads <code>poker/prestige-defs.js</code> — the same file the game uses. Drag to reorder, edit costs, export a paste-ready <code>prestige-defs.js</code> or JSON.</p>
      </div>
      <div class="toolbar">
        <button type="button" id="sortCost">Sort by Lv1 cost</button>
        <button type="button" id="reloadBtn">Reload from live</button>
        <button type="button" id="importBtn">Import JSON</button>
        <input class="import-file" id="importFile" type="file" accept="application/json,.json">
      </div>
    </header>

    <div class="layout">
      <section class="card">
        <div class="card-head">
          <span>Perks <span id="countLabel"></span></span>
          <span style="font-weight:500;color:var(--muted)">drag ☰ · click ▾ for description</span>
        </div>
        <div class="list" id="list"></div>
        <div class="list-tail" id="listTail">Drop here to move to end</div>
      </section>

      <div class="side">
        <section class="card">
          <div class="card-head">Order preview</div>
          <div class="flow-wrap">
            <svg class="flow" id="flow" viewBox="0 0 520 320" aria-hidden="true"></svg>
          </div>
        </section>

        <section class="card">
          <div class="card-head">Export</div>
          <div class="export-tabs">
            <button type="button" class="active" data-tab="js">prestige-defs.js</button>
            <button type="button" data-tab="json">JSON</button>
            <button type="button" data-tab="diff">Moved</button>
          </div>
          <textarea class="export" id="exportBox" readonly spellcheck="false"></textarea>
          <div class="export-actions">
            <button type="button" class="primary" id="copyBtn">Copy</button>
            <button type="button" id="downloadBtn">Download</button>
          </div>
          <div class="status" id="status"></div>
        </section>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../poker/prestige-defs.js"></script>
  <script>
    const STORAGE_KEY = 'vipPerkEditorDraft_v2';
    const DEFS_URL = new URL('../poker/prestige-defs.js', location.href).href;

    let liveBaseline = [];
    let perks = [];
    let activeTab = 'js';
    let dragId = null;
    let dropBeforeId = null;

    const listEl = document.getElementById('list');
    const listTailEl = document.getElementById('listTail');
    const exportBox = document.getElementById('exportBox');
    const statusEl = document.getElementById('status');
    const toastEl = document.getElementById('toast');
    const flowEl = document.getElementById('flow');

    function clone(arr) {
      return arr.map(p => ({ ...p }));
    }

    function snapshotLive() {
      if (!Array.isArray(window.PRESTIGE_DEFS) || !window.PRESTIGE_DEFS.length) {
        throw new Error('PRESTIGE_DEFS missing — is prestige-defs.js loaded?');
      }
      return clone(window.PRESTIGE_DEFS);
    }

    async function fetchLiveDefs() {
      const res = await fetch(DEFS_URL + '?t=' + Date.now());
      if (!res.ok) throw new Error('fetch failed: ' + res.status);
      const text = await res.text();
      const run = new Function(text + '\nreturn window.PRESTIGE_DEFS;');
      const defs = run();
      if (!Array.isArray(defs) || !defs.length) throw new Error('invalid prestige-defs.js');
      window.PRESTIGE_DEFS = defs;
      return clone(defs);
    }

    async function reloadFromLive(opts) {
      opts = opts || {};
      try {
        liveBaseline = await fetchLiveDefs();
      } catch (err) {
        console.warn('fetch live failed, using script tag', err);
        liveBaseline = snapshotLive();
      }
      if (opts.discardDraft || !loadDraft()) perks = clone(liveBaseline);
      else if (opts.resetWorkspace) perks = clone(liveBaseline);
      render();
      if (!opts.silent) showToast(opts.resetWorkspace ? 'Reloaded from live' : 'Live baseline refreshed');
    }

    function loadDraft() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) && parsed.length ? parsed : null;
      } catch {
        return null;
      }
    }

    function saveDraft() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(perks));
    }

    function levelCost(p, lvl) {
      if (lvl >= p.maxLevel) return null;
      return Math.floor(p.baseCost * Math.pow(p.costScale, lvl));
    }

    function previewCosts(p) {
      const bits = [];
      for (let i = 0; i < Math.min(3, p.maxLevel); i++) {
        bits.push(`Lv${i + 1} <b>${levelCost(p, i)}</b>c`);
      }
      if (p.maxLevel > 3) bits.push('…');
      return bits.join(' · ');
    }

    function escapeJs(str) {
      return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    function toJs(perk) {
      const lines = [
        '    {',
        `      id: '${perk.id}',`,
        `      name: '${escapeJs(perk.name)}',`,
        `      desc: '${escapeJs(perk.desc)}',`,
        `      baseCost: ${perk.baseCost},`,
        `      costScale: ${Number(perk.costScale)},`,
        `      maxLevel: ${perk.maxLevel}`
      ];
      if (perk.toggleable) lines.push('      toggleable: true');
      lines.push('    }');
      return lines.join('\n');
    }

    function exportJs() {
      return [
        '// Permanent VIP perks bought with comps from Cash Out.',
        '// VIP order = array order (curated; roughly cheap → expensive).',
        '// Loaded by poker/index.html and tools/vip-perk-editor.html — single source of truth.',
        'window.PRESTIGE_DEFS = [',
        perks.map(toJs).join(',\n'),
        '];'
      ].join('\n');
    }

    function exportJson() {
      return JSON.stringify(perks, null, 2);
    }

    function exportDiff() {
      const liveIndex = Object.fromEntries(liveBaseline.map((p, i) => [p.id, i]));
      const liveById = Object.fromEntries(liveBaseline.map(p => [p.id, p]));
      const lines = perks.map((p, i) => {
        const from = liveIndex[p.id];
        const live = liveById[p.id];
        const delta = from == null ? '?' : i - from;
        const arrow = delta === '?' ? ' ?' : delta === 0 ? '·' : delta < 0 ? `↑${-delta}` : `↓${delta}`;
        const costChanged = !live || p.baseCost !== live.baseCost || p.costScale !== live.costScale || p.maxLevel !== live.maxLevel;
        const costNote = costChanged ? '  (edited)' : '';
        return `${String(i + 1).padStart(2)}. ${p.name.padEnd(22)} ${String(p.baseCost).padStart(3)}c  ${String(arrow).padStart(4)}${costNote}`;
      });
      return lines.join('\n');
    }

    function refreshExport() {
      if (activeTab === 'js') exportBox.value = exportJs();
      else if (activeTab === 'json') exportBox.value = exportJson();
      else exportBox.value = exportDiff();
      statusEl.textContent = `${perks.length} perks · baseline from prestige-defs.js · draft autosaved`;
      document.getElementById('countLabel').textContent = `(${perks.length})`;
      drawFlow();
    }

    function drawFlow() {
      const n = perks.length;
      const h = Math.max(320, 28 + n * 12);
      flowEl.setAttribute('viewBox', `0 0 520 ${h}`);
      const liveIndex = Object.fromEntries(liveBaseline.map((p, i) => [p.id, i]));
      const leftX = 28;
      const rightX = 492;
      const top = 18;
      const rowH = 12;
      const midX = (leftX + rightX) / 2;
      const y = i => top + i * rowH + rowH / 2;

      const paths = perks.map((p, to) => {
        const from = liveIndex[p.id];
        const delta = to - from;
        const color = delta < 0 ? 'var(--up)' : delta > 0 ? 'var(--down)' : 'var(--same, #8aa8c4)';
        const y1 = y(from);
        const y2 = y(to);
        const c1x = leftX + (midX - leftX) * 0.9;
        const c2x = rightX - (rightX - midX) * 0.9;
        return `<path d="M ${leftX + 4} ${y1} C ${c1x} ${y1}, ${c2x} ${y2}, ${rightX - 4} ${y2}" fill="none" stroke="${color}" stroke-width="1.4" opacity="0.45"/>`;
      }).join('');

      const leftLabels = liveBaseline.map((p, i) => {
        const short = p.name.length > 16 ? p.name.slice(0, 15) + '…' : p.name;
        return `<text x="${leftX - 4}" y="${y(i) + 3}" fill="rgba(247,241,227,0.55)" font-size="8" text-anchor="end">${short}</text>`;
      }).join('');

      const rightLabels = perks.map((p, i) => {
        const short = p.name.length > 16 ? p.name.slice(0, 15) + '…' : p.name;
        return `<text x="${rightX + 4}" y="${y(i) + 3}" fill="rgba(247,241,227,0.82)" font-size="8" text-anchor="start">${short}</text>`;
      }).join('');

      flowEl.innerHTML = `
        <text x="${leftX}" y="10" fill="#f0d78c" font-size="9" text-anchor="start">Live</text>
        <text x="${rightX}" y="10" fill="#f0d78c" font-size="9" text-anchor="end">Current</text>
        <g>${paths}</g>
        <g>${leftLabels}</g>
        <g>${rightLabels}</g>
      `;
    }

    function wireListTail() {
      listTailEl.addEventListener('dragover', e => {
        e.preventDefault();
        if (!dragId) return;
        listTailEl.classList.add('drag-over');
      });
      listTailEl.addEventListener('dragleave', () => listTailEl.classList.remove('drag-over'));
      listTailEl.addEventListener('drop', e => {
        e.preventDefault();
        listTailEl.classList.remove('drag-over');
        const fromId = e.dataTransfer.getData('text/plain') || dragId;
        if (!fromId) return;
        movePerk(fromId, null);
      });
    }

    function render() {
      listEl.innerHTML = '';
      perks.forEach((perk, index) => {
        const row = document.createElement('article');
        row.className = 'row';
        row.dataset.id = perk.id;
        row.draggable = true;
        row.innerHTML = `
          <div class="handle" title="Drag to reorder">☰</div>
          <div class="title-wrap">
            <div class="rank">#${index + 1}</div>
            <input class="name" value="${escapeAttr(perk.name)}" aria-label="Name">
            <div class="id">${perk.id}</div>
          </div>
          <div class="field-base">
            <label>Base cost</label>
            <input class="num" type="number" min="0" step="1" value="${perk.baseCost}" aria-label="Base cost">
          </div>
          <div class="field-scale">
            <label>Cost scale</label>
            <input class="num" type="number" min="0" step="0.01" value="${perk.costScale}" aria-label="Cost scale">
          </div>
          <div class="field-max">
            <label>Max level</label>
            <input class="num" type="number" min="1" step="1" value="${perk.maxLevel}" aria-label="Max level">
          </div>
          <div class="preview">${previewCosts(perk)}</div>
          <div class="toggle-wrap" title="Toggleable perk">
            <label><input type="checkbox" ${perk.toggleable ? 'checked' : ''}> ⇄</label>
          </div>
          <button type="button" class="expand" title="Edit description">▾</button>
          <div class="desc-wrap">
            <label>Description</label>
            <textarea class="desc" aria-label="Description">${escapeHtml(perk.desc)}</textarea>
          </div>
        `;

        row.querySelector('.name').addEventListener('input', e => {
          perk.name = e.target.value;
          persist();
        });
        row.querySelector('.field-base .num').addEventListener('input', e => {
          perk.baseCost = clampNum(e.target.value, 0, 1e9, perk.baseCost);
          row.querySelector('.preview').innerHTML = previewCosts(perk);
          persist();
        });
        row.querySelector('.field-scale .num').addEventListener('input', e => {
          perk.costScale = clampNum(e.target.value, 0, 100, perk.costScale, true);
          row.querySelector('.preview').innerHTML = previewCosts(perk);
          persist();
        });
        row.querySelector('.field-max .num').addEventListener('input', e => {
          perk.maxLevel = clampNum(e.target.value, 1, 999, perk.maxLevel);
          row.querySelector('.preview').innerHTML = previewCosts(perk);
          persist();
        });
        row.querySelector('.toggle-wrap input').addEventListener('change', e => {
          if (e.target.checked) perk.toggleable = true;
          else delete perk.toggleable;
          persist();
        });
        row.querySelector('.desc').addEventListener('input', e => {
          perk.desc = e.target.value;
          persist();
        });
        row.querySelector('.expand').addEventListener('click', () => {
          row.classList.toggle('open');
        });

        wireDrag(row, perk.id);
        listEl.appendChild(row);
      });
      refreshExport();
    }

    function escapeAttr(s) {
      return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function clampNum(raw, min, max, fallback, float) {
      const n = float ? parseFloat(raw) : parseInt(raw, 10);
      if (!Number.isFinite(n)) return fallback;
      return Math.min(max, Math.max(min, n));
    }

    function persist() {
      saveDraft();
      refreshExport();
    }

    function wireDrag(row, id) {
      row.addEventListener('dragstart', e => {
        dragId = id;
        row.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', id);
      });
      row.addEventListener('dragend', () => {
        dragId = null;
        dropBeforeId = null;
        row.classList.remove('dragging');
        document.querySelectorAll('.row.drag-over').forEach(el => el.classList.remove('drag-over'));
      });
      row.addEventListener('dragover', e => {
        e.preventDefault();
        if (!dragId || dragId === id) return;
        const rect = row.getBoundingClientRect();
        const before = e.clientY < rect.top + rect.height / 2;
        dropBeforeId = before ? id : nextId(id);
        row.classList.add('drag-over');
      });
      row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
      row.addEventListener('drop', e => {
        e.preventDefault();
        row.classList.remove('drag-over');
        const fromId = e.dataTransfer.getData('text/plain') || dragId;
        if (!fromId || fromId === id) return;
        const rect = row.getBoundingClientRect();
        const before = e.clientY < rect.top + rect.height / 2;
        movePerk(fromId, before ? id : nextId(id));
      });
    }

    function nextId(id) {
      const i = perks.findIndex(p => p.id === id);
      return i >= 0 && i < perks.length - 1 ? perks[i + 1].id : null;
    }

    function movePerk(fromId, beforeId) {
      const from = perks.findIndex(p => p.id === fromId);
      if (from < 0) return;
      const [item] = perks.splice(from, 1);
      let to = beforeId == null ? perks.length : perks.findIndex(p => p.id === beforeId);
      if (to < 0) to = perks.length;
      perks.splice(to, 0, item);
      render();
      saveDraft();
      showToast('Reordered');
    }

    document.getElementById('sortCost').addEventListener('click', () => {
      perks.sort((a, b) => a.baseCost - b.baseCost || a.name.localeCompare(b.name));
      render();
      saveDraft();
      showToast('Sorted by Lv1 cost');
    });

    document.getElementById('reloadBtn').addEventListener('click', async () => {
      if (!confirm('Reload from poker/prestige-defs.js? Unsaved draft changes will be discarded.')) return;
      localStorage.removeItem(STORAGE_KEY);
      await reloadFromLive({ discardDraft: true, resetWorkspace: true });
    });

    document.querySelectorAll('.export-tabs button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.export-tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTab = btn.dataset.tab;
        refreshExport();
      });
    });

    document.getElementById('copyBtn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(exportBox.value);
        statusEl.textContent = 'Copied to clipboard';
        statusEl.className = 'status ok';
        showToast('Copied');
      } catch {
        exportBox.select();
        document.execCommand('copy');
        statusEl.textContent = 'Copied (fallback)';
        statusEl.className = 'status ok';
      }
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
      const ext = activeTab === 'json' ? 'json' : 'js';
      const mime = activeTab === 'json' ? 'application/json' : 'text/javascript';
      const blob = new Blob([exportBox.value], { type: mime });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = activeTab === 'json' ? 'prestige-defs.json' : 'prestige-defs.js';
      a.click();
      URL.revokeObjectURL(a.href);
      showToast('Downloaded');
    });

    document.getElementById('importBtn').addEventListener('click', () => {
      document.getElementById('importFile').click();
    });

    document.getElementById('importFile').addEventListener('change', async e => {
      const file = e.target.files?.[0];
      e.target.value = '';
      if (!file) return;
      try {
        const parsed = JSON.parse(await file.text());
        if (!Array.isArray(parsed) || !parsed.every(p => p.id && p.name)) throw new Error('bad shape');
        perks = parsed.map(p => ({ ...p }));
        render();
        saveDraft();
        showToast('Imported JSON');
      } catch (err) {
        alert('Import failed — expected a JSON array of perk objects with id/name.');
      }
    });

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toastEl.classList.remove('show'), 1400);
    }

    async function boot() {
      try {
        liveBaseline = snapshotLive();
      } catch (err) {
        statusEl.textContent = 'Failed to load prestige-defs.js';
        statusEl.className = 'status';
        throw err;
      }
      const draft = loadDraft();
      perks = draft || clone(liveBaseline);
      render();
      wireListTail();
      // Refresh baseline from network so "Live" column matches disk after hot edits.
      reloadFromLive({ silent: true }).catch(() => {});
    }

    boot();
  </script>
</body>
</html>
